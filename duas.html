<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Duain</title>
<meta name="theme-color" content="#0f6b4a">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #075B43; --primary-light: #117A58; --primary-deep: #064B38;
  --gold: #E5C15B; --gold-light: #f2cf6b;
  --bg: #F8F9F6; --surface: #FFFFFF; --text: #123F32; --text-secondary: #64756C;
  --shadow-sm: 0 2px 6px rgba(0,60,30,0.05); --shadow-md: 0 4px 12px rgba(0,60,30,0.08);
  --r-md: 12px; --r-lg: 16px; --r-full: 999px;
  --font-urdu: "Noto Nastaliq Urdu", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body { font-family: var(--font-urdu); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
.header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--primary); color: #fff; }
.header h1 { font-size: 20px; font-weight: 700; color: var(--gold-light); margin: 0; }
.header a, .header button { color: #fff; text-decoration: none; font-size: 20px; background: none; border: none; cursor: pointer; }
.container { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
.search-bar { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: var(--r-full); padding: 6px 8px; box-shadow: var(--shadow-sm); border: 1.5px solid var(--gold); }
.search-bar input { flex: 1; border: none; outline: none; background: transparent; font-family: inherit; font-size: 14px; padding: 6px; color: var(--text); }
.search-bar button { background: var(--primary); color: #fff; border: none; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.dua-list { display: flex; flex-direction: column; gap: 12px; }
.dua-item { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #e0e0e0; border-radius: var(--r-md); padding: 12px 16px; box-shadow: var(--shadow-sm); cursor: pointer; }
.dua-item:active { transform: scale(0.98); background: #f8f9f6; }
.dua-left { display: flex; align-items: center; gap: 12px; }
.dua-num { background: var(--primary); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-family: sans-serif; font-weight: bold; flex-shrink: 0; }
.dua-title { font-size: 16px; font-weight: 600; color: var(--primary-deep); }
.dua-actions { display: flex; gap: 8px; flex-shrink: 0; }
.dua-actions button { background: none; border: none; font-size: 18px; color: var(--text-secondary); cursor: pointer; padding: 4px; }
.dua-actions button.fav { color: #e74c3c; }
.dua-actions button.edit-btn { color: #3498db; }
.detail-page { display: none; flex-direction: column; gap: 16px; height: 100%; }
.detail-page.active { display: flex; }
.list-page.hidden { display: none; }
.dua-detail-card { background: #fff; border-radius: var(--r-lg); padding: 24px; box-shadow: var(--shadow-md); border: 1.5px solid var(--gold); text-align: center; }
.dua-detail-card h2 { font-size: 20px; color: var(--primary); margin-bottom: 16px; }
.dua-arabic { font-size: 26px; line-height: 2.5; color: var(--text); margin-bottom: 16px; font-weight: 600; }
.dua-urdu { font-size: 16px; line-height: 2.2; color: var(--text-secondary); margin-bottom: 16px; background: var(--bg); padding: 12px; border-radius: var(--r-md); }
.detail-actions { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }
.detail-actions button { background: var(--primary); color: #fff; border: none; border-radius: var(--r-full); padding: 10px 20px; font-family: inherit; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.detail-actions button.ghost { background: #e8f1eb; color: var(--primary-deep); }
.back-btn { background: var(--gold); color: #4a3200; border: none; border-radius: var(--r-md); padding: 10px; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
.empty-state { text-align: center; padding: 30px; color: var(--text-secondary); font-size: 14px; }

/* Admin Panel Style */
#adminPanel { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #fff; z-index: 100; flex-direction: column; padding: 16px; overflow-y: auto; }
#adminPanel.active { display: flex; }
.admin-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.admin-hdr h2 { color: var(--primary); font-size: 18px; }
.admin-hdr button { background: #e74c3c; color: #fff; border: none; border-radius: 8px; padding: 8px 12px; font-family: inherit; }
.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.form-group label { font-size: 14px; font-weight: bold; color: var(--text); }
.form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; font-size: 15px; }
.form-group textarea { height: 100px; resize: vertical; }
.btn-save { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 12px; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
.btn-add-new { background: var(--gold); color: #4a3200; border: none; border-radius: 8px; padding: 12px; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 16px; }
.admin-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.admin-item { display: flex; justify-content: space-between; align-items: center; background: #f8f9f6; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
.admin-item span { font-size: 15px; font-weight: bold; }
.admin-item .actions { display: flex; gap: 8px; }
.admin-item button { background: none; border: none; font-size: 18px; cursor: pointer; }
.text-json { width: 100%; height: 200px; padding: 10px; border: 1px solid var(--gold); border-radius: 8px; font-family: monospace; font-size: 12px; direction: ltr; }
.copy-btn { background: #2980b9; color: #fff; border: none; border-radius: 8px; padding: 12px; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
</style>
</head>
<body>

<header class="header">
  <a href="index.html" style="font-size:24px;">←</a>
  <h1>مسنون دعائیں</h1>
  <button id="adminToggle" style="font-size:18px; opacity:0.5;">⚙️</button>
</header>

<div class="container">
  <!-- Dua List Page -->
  <div class="list-page" id="listPage">
    <div class="search-bar">
      <button>🔍</button>
      <input type="text" id="searchInput" placeholder="دعا تلاش کریں...">
    </div>
    <div class="dua-list" id="duaList"></div>
    <div class="empty-state" id="emptyState" style="display:none;">کوئی دعا نہیں ملی</div>
  </div>

  <!-- Dua Detail Page -->
  <div class="detail-page" id="detailPage">
    <button class="back-btn" id="backBtn">← واپس فہرست میں</button>
    <div class="dua-detail-card">
      <h2 id="dTitle"></h2>
      <div class="dua-arabic" id="dArabic"></div>
      <div class="dua-urdu" id="dUrdu"></div>
      <div class="detail-actions">
        <button id="dFav">🤍 پسندیدہ</button>
        <button id="dCopy" class="ghost">📋 کاپی</button>
        <button id="dShare" class="ghost">📤 شیئر</button>
      </div>
    </div>
  </div>
</div>

<!-- Admin Panel -->
<div id="adminPanel">
  <div class="admin-hdr">
    <h2>ایڈمن پینل</h2>
    <button id="closeAdmin">❌ بند کریں</button>
  </div>
  
  <button class="btn-add-new" id="addNewDua">➕ نئی دعا شامل کریں</button>
  
  <div id="editForm" style="display:none;">
    <div class="form-group">
      <label>عنوان (Title)</label>
      <input type="text" id="inpTitle" placeholder="مثلاً: کھانے سے پہلے کی دعا">
    </div>
    <div class="form-group">
      <label>عربی اور اردو ترجمہ (Detail)</label>
      <textarea id="inpDetail" placeholder="عربی متن...\n\nترجمہ: ..."></textarea>
    </div>
    <button class="btn-save" id="saveDuaBtn">محفوظ کریں</button>
    <button class="back-btn" id="cancelEditBtn" style="width:100%; margin-top:8px; background:#ccc;">منسوخ کریں</button>
  </div>

  <div class="admin-list" id="adminList"></div>

  <h3>📋 کوڈ کاپی کریں (data.json کے لیے)</h3>
  <textarea class="text-json" id="jsonOutput" readonly></textarea>
  <button class="copy-btn" id="copyJsonBtn">📋 کوڈ کاپی کریں</button>
</div>

<script>
let allDuas = [];
let currentEditIndex = -1;
let FAV_DUAS = [];
try { FAV_DUAS = JSON.parse(localStorage.getItem("fav_duas") || "[]"); } catch(e) { FAV_DUAS = []; }

const listPage = document.getElementById('listPage');
const detailPage = document.getElementById('detailPage');
const duaList = document.getElementById('duaList');
const searchInput = document.getElementById('searchInput');
const emptyState = document.getElementById('emptyState');
const adminPanel = document.getElementById('adminPanel');

function saveFavDuas() {
  localStorage.setItem("fav_duas", JSON.stringify(FAV_DUAS));
}

// Fetch Data
async function loadData() {
  try {
    const res = await fetch("data.json", { cache: "no-store" });
    const data = await res.json();
    if (data.info && data.info.items) {
      allDuas = data.info.items;
      renderList(allDuas);
      renderAdminList();
    }
  } catch (e) {
    duaList.innerHTML = "<div class='empty-state'>ڈیٹا لوڈ نہیں ہو سکا</div>";
  }
}

function renderList(items) {
  duaList.innerHTML = "";
  if (items.length === 0) {
    emptyState.style.display = "block";
    return;
  }
  emptyState.style.display = "none";

  items.forEach((dua, index) => {
    const isFav = FAV_DUAS.includes(dua.t);
    const div = document.createElement('div');
    div.className = 'dua-item';
    div.innerHTML = `
      <div class="dua-left">
        <div class="dua-num">${index + 1}</div>
        <div class="dua-title">${dua.t}</div>
      </div>
      <div class="dua-actions">
        <button class="fav-btn ${isFav ? 'fav' : ''}" data-title="${dua.t}">${isFav ? '❤️' : '🤍'}</button>
        <button class="share-btn" data-title="${dua.t}">📤</button>
      </div>
    `;

    div.onclick = (e) => {
      if (e.target.closest('button')) return;
      openDetail(dua);
    };

    const favBtn = div.querySelector('.fav-btn');
    favBtn.onclick = (e) => {
      e.stopPropagation();
      toggleFav(dua.t, favBtn);
    };

    const shareBtn = div.querySelector('.share-btn');
    shareBtn.onclick = (e) => {
      e.stopPropagation();
      shareDua(dua);
    };

    duaList.appendChild(div);
  });
}

function toggleFav(title, btn) {
  const idx = FAV_DUAS.indexOf(title);
  if (idx >= 0) {
    FAV_DUAS.splice(idx, 1);
    btn.classList.remove('fav');
    btn.innerText = '🤍';
  } else {
    FAV_DUAS.push(title);
    btn.classList.add('fav');
    btn.innerText = '❤️';
  }
  saveFavDuas();
}

function shareDua(dua) {
  const text = dua.t + "\n\n" + dua.d + "\n\n— Meri Islamic App";
  if (navigator.share) {
    navigator.share({ title: dua.t, text: text });
  } else {
    window.open("https://wa.me/?text=" + encodeURIComponent(text));
  }
}

function openDetail(dua) {
  listPage.classList.add('hidden');
  detailPage.classList.add('active');

  document.getElementById('dTitle').innerText = dua.t;
  
  const parts = dua.d.split("\n\n");
  const arabicPart = parts[0] || "";
  const urduPart = parts[1] || "";

  document.getElementById('dArabic').innerText = arabicPart;
  document.getElementById('dUrdu').innerText = urduPart;

  const isFav = FAV_DUAS.includes(dua.t);
  const favBtn = document.getElementById('dFav');
  favBtn.innerHTML = isFav ? "❤️ پسندیدہ" : "🤍 پسندیدہ";
  favBtn.onclick = () => {
    const idx = FAV_DUAS.indexOf(dua.t);
    if (idx >= 0) { FAV_DUAS.splice(idx, 1); favBtn.innerHTML = "🤍 پسندیدہ"; }
    else { FAV_DUAS.push(dua.t); favBtn.innerHTML = "❤️ پسندیدہ"; }
    saveFavDuas();
    renderList(allDuas);
  };

  document.getElementById('dCopy').onclick = () => {
    const text = dua.t + "\n\n" + dua.d;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => alert("کاپی ہو گیا!"));
    } else {
      alert("کاپی نہیں ہو سکا");
    }
  };

  document.getElementById('dShare').onclick = () => shareDua(dua);
}

document.getElementById('backBtn').onclick = () => {
  detailPage.classList.remove('active');
  listPage.classList.remove('hidden');
};

searchInput.oninput = (e) => {
  const query = e.target.value.toLowerCase();
  const filtered = allDuas.filter(d => d.t.toLowerCase().includes(query) || d.d.toLowerCase().includes(query));
  renderList(filtered);
};

// ---- ADMIN PANEL LOGIC ----
const SECRET_PIN = "786"; // Aap yahan apna PIN badal sakte hain
const adminToggle = document.getElementById('adminToggle');
const closeAdmin = document.getElementById('closeAdmin');
const addNewDua = document.getElementById('addNewDua');
const editForm = document.getElementById('editForm');
const inpTitle = document.getElementById('inpTitle');
const inpDetail = document.getElementById('inpDetail');
const saveDuaBtn = document.getElementById('saveDuaBtn');
const cancelEditBtn = document.getElementById('cancelEditBtn');
const adminList = document.getElementById('adminList');
const jsonOutput = document.getElementById('jsonOutput');
const copyJsonBtn = document.getElementById('copyJsonBtn');

adminToggle.onclick = () => {
  const pin = prompt("براہ کرم ایڈمن پن کوڈ درج کریں:");
  if (pin === SECRET_PIN) {
    adminPanel.classList.add('active');
    renderAdminList();
  } else {
    alert("غلط پن کوڈ!");
  }
};

closeAdmin.onclick = () => {
  adminPanel.classList.remove('active');
  editForm.style.display = 'none';
};

addNewDua.onclick = () => {
  currentEditIndex = -1;
  inpTitle.value = "";
  inpDetail.value = "";
  editForm.style.display = 'block';
};

cancelEditBtn.onclick = () => {
  editForm.style.display = 'none';
};

saveDuaBtn.onclick = () => {
  const title = inpTitle.value.trim();
  const detail = inpDetail.value.trim();
  if (!title || !detail) {
    alert("عنوان اور تفصیل دونوں لکھنا ضروری ہے!");
    return;
  }

  if (currentEditIndex === -1) {
    // Add new
    allDuas.push({ t: title, d: detail });
  } else {
    // Edit existing
    allDuas[currentEditIndex] = { t: title, d: detail };
  }

  renderList(allDuas);
  renderAdminList();
  updateJsonOutput();
  editForm.style.display = 'none';
  alert("محفوظ ہو گیا! اب نیچے سے کوڈ کاپی کریں اور GitHub پر اپڈیٹ کریں۔");
};

function renderAdminList() {
  adminList.innerHTML = "";
  allDuas.forEach((dua, index) => {
    const div = document.createElement('div');
    div.className = 'admin-item';
    div.innerHTML = `
      <span>${index + 1}. ${dua.t}</span>
      <div class="actions">
        <button class="edit-btn" data-idx="${index}">✏️</button>
        <button class="del-btn" data-idx="${index}">🗑️</button>
      </div>
    `;
    
    div.querySelector('.edit-btn').onclick = () => {
      currentEditIndex = index;
      inpTitle.value = dua.t;
      inpDetail.value = dua.d;
      editForm.style.display = 'block';
    };

    div.querySelector('.del-btn').onclick = () => {
      if (confirm("کیا آپ واقعی یہ دعا ڈیلیٹ کرنا چاہتے ہیں؟")) {
        allDuas.splice(index, 1);
        renderAdminList();
        renderList(allDuas);
        updateJsonOutput();
      }
    };

    adminList.appendChild(div);
  });
}

function updateJsonOutput() {
  const newObj = { info: { title: "Duain", icon: "🤲", items: allDuas } };
  jsonOutput.value = JSON.stringify(newObj, null, 2);
}

copyJsonBtn.onclick = () => {
  jsonOutput.select();
  document.execCommand("copy");
  alert("کوڈ کاپی ہو گیا! اب اسے data.json میں پیسٹ کریں۔");
};

// Init
loadData();
</script>
</body>
</html>

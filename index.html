<style>
@font-face { font-family: "LatinSans"; src: local("Roboto"), local("Inter"), local("Segoe UI"), local("Helvetica Neue"), local("Arial"); unicode-range: U+0000-024F, U+2013-2014, U+2018-201D, U+2026; }
:root {
  --primary: #075B43; --primary-light: #117A58; --primary-deep: #064B38;
  --primary-gradient: linear-gradient(160deg, #0b5b3c, #0d6f48 55%, #0a4a31);
  --primary-gradient-hero: radial-gradient(circle at 50% 0%, #17935f 0%, rgba(23,147,95,0) 60%), linear-gradient(160deg, #0b5b3c, #0d6f48 55%, #0a4a31);
  --gold: #E5C15B; --gold-light: #f2cf6b; --gold-dark: #c49b38;
  --gold-gradient: linear-gradient(135deg, #f6dc83, #d9b44a 50%, #f2cf6b);
  --bg: #F8F9F6; --surface: #FFFFFF; --surface-tint: #F4F8F5;
  --text: #123F32; --text-secondary: #64756C; --text-on-primary: #ffffff;
  --dark-bg: #0b1612; --dark-panel: #12231c; --dark-panel-2: #0f1c17;
  --dark-border: #23403a; --dark-border-2: #2c4a42;
  --dark-text: #e6efe9; --dark-text-soft: #cfe0d6; --dark-text-muted: #9bb3a8;
  --dark-name: #6fd3aa; --dark-english: #d4b84a;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-full: 999px;
  --shadow-sm: 0 2px 6px rgba(0,60,30,0.05);
  --shadow-md: 0 4px 12px rgba(0,60,30,0.08);
  --shadow-lg: 0 8px 24px rgba(0,60,30,0.12);
  --font-urdu: "LatinSans", "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", sans-serif;
  --t-fast: 150ms; --t-med: 250ms; --surface-border: rgba(0,0,0,0.06);
  --font-num: Georgia, "Times New Roman", serif;
  --font-scale: 1;
}
body.theme-dark {
  --bg: #101A16; --surface: #1C2B24; --surface-tint: #1C2B24;
  --text: #F5F7F5; --text-secondary: #B6C4BC; --primary: #146B4F;
  --primary-gradient: linear-gradient(160deg, #0f5a41, #146B4F 55%, #0b4a36);
  --primary-gradient-hero: radial-gradient(circle at 50% 0%, #1a8f63 0%, rgba(26,143,99,0) 60%), linear-gradient(160deg, #0f5a41, #146B4F 55%, #0b4a36);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; overflow-x: hidden; overflow-wrap: break-word;
  font-family: var(--font-urdu); background: var(--bg); color: var(--text);
  padding-bottom: calc(80px + env(safe-area-inset-bottom)); min-height: 100vh;
  font-size: calc(16px * var(--font-scale));
  transition: background-color var(--t-med), color var(--t-med);
}
body.dark { background: var(--dark-bg); color: var(--dark-text); }

#hdr { background: var(--primary); color: var(--text-on-primary); padding: 22px 16px; text-align: center; position: relative; }
#hdr h1 { margin: 0 0 4px; font-size: 24px; line-height: 1.9; position: relative; z-index: 2; }
#hdr p { margin: 0; opacity: 0.85; line-height: 1.8; position: relative; z-index: 2; }
#greet { display: none; }
.decos { display: none; position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.deco { position: absolute; height: auto; }
#hdr.hero { background: var(--primary-gradient-hero); padding: 22px 16px 58px; border-radius: 0 0 28px 28px; box-shadow: 0 8px 24px rgba(0,40,20,0.2); overflow: hidden; display: flex; flex-direction: column; align-items: center; }
#hdr.hero .decos { display: block; border-radius: 0 0 28px 28px; }
#hdr.hero h1 { font-size: 27px; line-height: 1.4; margin: 2px 0 0; font-weight: 700; color: var(--gold-light); text-shadow: 0 2px 8px rgba(0,0,0,0.35); z-index: 5; }
#hdr.hero p { font-size: 13px; line-height: 1.6; color: #dff3e8; opacity: 0.9; font-weight: 500; z-index: 5; }
#hdr.hero #greet { display: block; order: -1; margin: 0; font-size: 13px; line-height: 1.6; color: #e9f7ee; opacity: 0.85; position: relative; z-index: 5; }
#hdr.hero #greet::before { display: none; }
#hdr.hero .lantern { display: none; }
#hdr.hero .moon { opacity: 0.2; width: 44px; top: 10px; }
#hdr.hero .mosque { opacity: 0.18; }

.moon { top: 15px; left: 50%; transform: translateX(-50%); width: 60px; filter: drop-shadow(0 0 15px rgba(247,224,140,0.9)); animation: moonGlow 4s ease-in-out infinite; opacity: 0.3; z-index: 0; }
.mosque { left: 0; bottom: 0; width: 100%; opacity: 0.4; z-index: 0; }
.lantern { width: 30px; filter: drop-shadow(0 0 12px rgba(247,224,140,0.9)); transform-origin: 50% 0; animation: swing 5s ease-in-out infinite; opacity: 0.4; z-index: 0; }
.lantern-l { left: 15px; top: -10px; animation-delay: 0s; }
.lantern-r { right: 15px; top: -10px; animation-delay: 1.2s; }
.lantern-c1 { left: 30%; top: -15px; animation-delay: 0.5s; width: 22px; }
.lantern-c2 { right: 30%; top: -15px; animation-delay: 0.8s; width: 22px; }
@keyframes swing { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@keyframes moonGlow { 0%, 100% { filter: drop-shadow(0 0 10px rgba(247,224,140,0.5)); } 50% { filter: drop-shadow(0 0 20px rgba(247,224,140,0.8)); } }

#back, #menuBtn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; width: 44px; height: 44px; border-radius: 50%; font-family: inherit; font-size: 18px; z-index: 10; display: flex; align-items: center; justify-content: center; transition: background var(--t-fast), transform var(--t-fast); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
#back { display: none; right: 16px; padding: 0; }
#back svg { width: 22px; height: 22px; }
#menuBtn { left: 16px; font-size: 28px; line-height: 1; padding: 0 0 8px 0; font-family: sans-serif; }
#back:active, #menuBtn:active { background: rgba(255,255,255,0.3); transform: translateY(-50%) scale(0.92); }
#hdr.hero #menuBtn { top: 16px; transform: none; }
#hdr.hero #menuBtn:active { transform: scale(0.92); }
#hdr.hero #back { top: 16px; transform: none; }
#hdr.hero #back:active { transform: scale(0.92); }

#menu { display: none; position: absolute; left: 16px; top: 85px; background: var(--surface); color: var(--text); border-radius: var(--r-lg); box-shadow: 0 10px 30px rgba(0,0,0,0.15); min-width: 190px; z-index: 25; overflow: hidden; animation: menuIn 180ms ease both; border: 1px solid var(--surface-border); }
@keyframes menuIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
#hdr.hero #menu { top: 64px; }
#menu.show { display: block; }
#menu button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: right; padding: 12px 16px; border: 0; background: none; font-family: inherit; font-size: 15px; color: inherit; line-height: 1.8; font-weight: 500; }
#menu button + button { border-top: 1px solid rgba(0,0,0,0.05); }
body.theme-dark #menu button + button { border-top-color: rgba(255,255,255,0.08); }

#modal { display: none; position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 30; padding: 20px; backdrop-filter: blur(2px); }
#modal.show { display: flex; }
#modalBox { background: var(--surface); color: var(--text); border-radius: var(--r-lg); padding: 24px; line-height: 2.2; max-width: 460px; width: 100%; text-align: center; font-size: 17px; max-height: 85vh; overflow-y: auto; animation: menuIn 200ms ease both; }
.mb { background: none; border: 0; font-size: 26px; padding: 4px 12px; }
.toast { position: fixed; bottom: calc(100px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(6,60,40,0.96); color: #fff; padding: 10px 20px; border-radius: var(--r-full); font-family: inherit; font-size: 14px; line-height: 1.6; box-shadow: 0 6px 20px rgba(0,0,0,0.35); opacity: 0; pointer-events: none; transition: opacity 200ms ease, transform 200ms ease; z-index: 100; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

#app { padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
body.home #app { padding: 0 16px 20px; gap: 14px; }
#app > * { min-width: 0; max-width: 100%; }

.sb { display: flex; align-items: center; gap: 4px; background: var(--surface); border-radius: var(--r-full); padding: 4px 4px 4px 16px; box-shadow: 0 6px 18px rgba(0,60,30,0.12); margin-top: -28px; position: relative; z-index: 3; border: 1px solid var(--surface-border); }
.sb input { flex: 1 1 auto; width: 0; min-width: 0; border: 0; outline: 0; background: none; font-family: inherit; font-size: 15px; color: var(--text); padding: 10px 4px; line-height: 1.4; text-align: left; }
.sb input::placeholder { color: var(--text-secondary); opacity: 0.85; }
.sgo { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; }
.mic { flex: 0 0 auto; border: 0; background: none; color: var(--primary); padding: 8px; display: flex; align-items: center; }
.clear-sb { flex: 0 0 auto; border: 0; background: none; color: var(--text-secondary); padding: 8px; display: none; align-items: center; }
.clear-sb.show { display: flex; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
body.theme-dark .mic { color: #6fd3aa; }

.np { display: flex; align-items: center; justify-content: space-between; background: var(--primary-gradient); color: #fff; border-radius: 18px; padding: 14px 18px; box-shadow: var(--shadow-md); cursor: pointer; position: relative; overflow: hidden; }
.np::after { content: ""; position: absolute; right: -34px; top: -34px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.06); pointer-events: none; }
.np:active { transform: scale(0.98); }
.np-l, .np-r { position: relative; z-index: 1; }
.np-k { font-size: 12px; line-height: 1.5; opacity: 0.8; letter-spacing: 0.3px; }
.np-n { font-size: 22px; font-weight: 700; line-height: 1.35; }
.np-t { font-size: 13px; line-height: 1.5; color: var(--gold-light); font-weight: 600; }
.np-r { text-align: right; }
.np-cd { font-size: 25px; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; color: var(--gold-light); }
.np-sub { font-size: 11.5px; line-height: 1.5; opacity: 0.8; }

.qa-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.qa { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 16px; padding: 12px 2px 10px; text-align: center; box-shadow: var(--shadow-sm); cursor: pointer; transition: transform 0.15s; }
.qa:active { transform: scale(0.95); }
.qa .qi { width: 42px; height: 42px; margin: 0 auto 6px; border-radius: 14px; background: var(--surface-tint); color: var(--primary); display: flex; align-items: center; justify-content: center; }
.qa .ql { font-size: 11.5px; font-weight: 600; line-height: 1.4; color: var(--text); }
body.theme-dark .qa .qi { color: #6fd3aa; }

.quote { position: relative; background: var(--primary-gradient); border-radius: 20px; padding: 18px 16px 14px; text-align: center; color: #fff; box-shadow: var(--shadow-md); overflow: hidden; }
.qlabel { font-size: 12px; line-height: 1.6; letter-spacing: 0.7px; color: var(--gold-light); font-weight: 600; text-transform: uppercase; margin-bottom: 6px; }
.qtext { unicode-bidi: plaintext; font-size: 18px; line-height: 2.1; padding: 0 4px 10px; font-weight: 500; }
.qline { display: none; }
.qactions { display: flex; justify-content: center; gap: 10px; align-items: center; }
.qactions button { background: rgba(255,255,255,0.14); border: 0; color: #fff; border-radius: 12px; min-width: 44px; height: 38px; padding: 0 12px; font-family: inherit; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: transform 0.1s; }
.qactions button svg.i { width: 19px; height: 19px; }
.qactions button:active { transform: scale(0.92); }
.qactions button.on { background: var(--gold-gradient); color: #4a3200; }
.qactions button.on svg.i { fill: currentColor; }

#nav { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; z-index: 15; display: flex; background: var(--surface); border-top: 1px solid var(--surface-border); padding: 8px 4px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 16px rgba(0,0,0,0.06); }
#nav button { flex: 1 1 0; min-width: 0; background: none; border: 0; color: var(--text-secondary); font-family: inherit; font-size: 11px; line-height: 1.4; padding: 4px 2px 2px; position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: color 0.2s; }
#nav button svg.i { width: 24px; height: 24px; }
#nav button.on { color: var(--primary); font-weight: 700; }
#nav button.on::before { content: ""; position: absolute; top: -9px; left: 50%; transform: translateX(-50%); width: 26px; height: 3px; background: var(--gold); border-radius: 3px; }
body.theme-dark #nav { background: var(--surface); border-top-color: rgba(255,255,255,0.08); }
body.dark #nav { background: var(--dark-panel); border-top-color: var(--dark-border); }
body.theme-dark #nav button.on, body.dark #nav button.on { color: #6fd3aa; }
body.dark #nav button { color: var(--dark-text-muted); }
body.dark #nav button.on { color: #6fd3aa; }

#app > .nsb, #app > .nch { flex: 0 0 auto; }
.nsb { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: var(--r-full); padding: 4px 8px 4px 16px; box-shadow: var(--shadow-sm); color: var(--text-secondary); }
.nsb input { flex: 1 1 auto; width: 0; min-width: 0; border: 0; outline: 0; background: none; font-family: inherit; font-size: 15px; color: var(--text); padding: 10px 0; text-align: left; }
.nsb input::placeholder { color: var(--text-secondary); opacity: 0.85; }
.nclr { display: none; border: 0; background: none; color: var(--text-secondary); padding: 8px; align-items: center; }
.nclr.show { display: flex; }
.nch { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
.nch::-webkit-scrollbar, .nletters::-webkit-scrollbar { display: none; }
.nc { flex: 0 0 auto; display: flex; align-items: center; gap: 5px; border: 0; background: var(--surface-tint); color: var(--primary); font-family: inherit; font-size: 13px; font-weight: 600; line-height: 1.4; padding: 8px 15px; border-radius: var(--r-full); }
.nc svg.i { width: 16px; height: 16px; }
.nc.on { background: var(--primary); color: #fff; }
.nletters { display: none; gap: 6px; overflow-x: auto; padding: 2px 0; scrollbar-width: none; }
.nletters.show { display: flex; }
.nl { flex: 0 0 auto; min-width: 40px; height: 40px; padding: 0 6px; border-radius: 12px; border: 1px solid var(--surface-border); background: var(--surface); color: var(--text); font-size: 19px; font-family: inherit; display: flex; align-items: center; justify-content: center; }
.nl.on { background: var(--primary); color: #fff; border-color: var(--primary); }
.ncount { font-size: 12.5px; line-height: 1.5; color: var(--text-secondary); padding: 0 4px; }
.nlist { display: flex; flex-direction: column; gap: 8px; }
.nrow { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 16px; padding: 10px 8px 10px 12px; box-shadow: var(--shadow-sm); cursor: pointer; transition: transform 0.12s; }
.nrow:active { transform: scale(0.99); }
.nav2 { flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; }
.nav2.m { background: #E6F1FB; color: #0C447C; }
.nav2.f { background: #FBEAF0; color: #72243E; }
.nbody { flex: 1 1 auto; min-width: 0; }
.nen { font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nmn { font-size: 13px; line-height: 1.8; color: var(--text-secondary); unicode-bidi: plaintext; text-align: left; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nur { flex: 0 0 auto; max-width: 38%; font-size: 21px; line-height: 1.8; color: var(--primary); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nhrt { flex: 0 0 auto; border: 0; background: none; color: var(--text-secondary); padding: 8px 6px; display: flex; }
.nhrt.on { color: #D4537E; }
.nhrt.on svg.i { fill: currentColor; }
.nmore { display: none; width: 100%; padding: 13px; font-family: inherit; font-size: 14px; font-weight: 600; background: var(--surface-tint); color: var(--primary); border: 0; border-radius: 14px; }
.nempty { padding: 36px 16px; text-align: center; color: var(--text-secondary); font-size: 14.5px; line-height: 1.9; }
body.theme-dark .nc, body.theme-dark .nmore { background: rgba(255,255,255,0.08); color: #9fe3c6; }
body.theme-dark .nc.on, body.theme-dark .nl.on { background: #146B4F; color: #fff; }
body.theme-dark .nur { color: #6fd3aa; }
body.theme-dark .nav2.m { background: #12304a; color: #b5d4f4; }
body.theme-dark .nav2.f { background: #4a1f31; color: #f4c0d1; }
body.theme-dark .nrow, body.theme-dark .nsb, body.theme-dark .nl { border-color: rgba(255,255,255,0.08); }

.card { background: var(--surface); border-radius: var(--r-lg); padding: 18px; font-size: 17px; line-height: 2; box-shadow: var(--shadow-sm); margin-bottom: 10px;}
.detail { background: var(--surface); border-radius: var(--r-lg); padding: 24px; line-height: 2.4; font-size: 17px; white-space: pre-line; box-shadow: var(--shadow-sm); }
.settings-list { display: grid; gap: 10px; }
.set-item { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid rgba(0,0,0,0.05); border-radius: var(--r-md); padding: 16px; font-size: 16px; }
.set-item .set-label { display: flex; align-items: center; gap: 10px; }
.set-item .set-ic { font-size: 20px; }
.toggle { position: relative; width: 50px; height: 28px; background: #ccc; border-radius: var(--r-full); transition: 0.3s; }
.toggle.on { background: var(--primary); }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; background: #fff; border-radius: 50%; transition: 0.3s; }
.toggle.on::after { transform: translateX(22px); }
.fs-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px;}
.fs-opt { background: var(--surface); border: 1px solid #ddd; border-radius: var(--r-md); padding: 10px; text-align: center; cursor: pointer; }
.fs-opt.on { background: var(--primary); color: #fff; }
.name-detail { text-align: center; padding: 24px; background: var(--surface); border-radius: var(--r-lg); }
.nd-name { font-size: 40px; color: var(--primary); font-weight: 700; margin-bottom: 4px; }
.nd-en { color: var(--gold-dark); font-size: 20px; font-family: var(--font-num); margin-bottom: 16px; }
.nd-meaning { font-size: 18px; background: var(--bg); padding: 16px; border-radius: var(--r-md); margin-bottom: 16px; }
.nd-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.nd-actions button { background: var(--primary); color: #fff; border: 0; border-radius: var(--r-full); padding: 10px 20px; font-family: inherit; font-size: 14px; }
</style>

/* ===== Agli namaz (qibla.html wala hi hisaab, location wahi se milti hai) ===== */
/* ==CALC START== */
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const sin = d => Math.sin(d * D2R), cos = d => Math.cos(d * D2R), tan = d => Math.tan(d * D2R);
const asin = x => Math.asin(x) * R2D, acos = x => Math.acos(x) * R2D, atan2 = (y, x) => Math.atan2(y, x) * R2D;
const arccot = x => Math.atan(1 / x) * R2D;
const fixAngle = a => { a = a - 360 * Math.floor(a / 360); return a; };
const fixHour = a => { a = a - 24 * Math.floor(a / 24); return a; };

const KAABA = { lat: 21.4225, lng: 39.8262 };

function qiblaBearing(lat, lng) {
  const dl = (KAABA.lng - lng);
  const y = sin(dl) * cos(KAABA.lat);
  const x = cos(lat) * sin(KAABA.lat) - sin(lat) * cos(KAABA.lat) * cos(dl);
  return fixAngle(atan2(y, x));
}
function distanceKm(lat, lng) {
  const dLat = (KAABA.lat - lat) * D2R, dLng = (KAABA.lng - lng) * D2R;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat * D2R) * Math.cos(KAABA.lat * D2R) * Math.sin(dLng / 2) ** 2;
  return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function julian(y, m, d) {
  if (m <= 2) { y -= 1; m += 12; }
  const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
}
function sunPos(jd) {
  const D = jd - 2451545.0;
  const g = fixAngle(357.529 + 0.98560028 * D);
  const q = fixAngle(280.459 + 0.98564736 * D);
  const L = fixAngle(q + 1.915 * sin(g) + 0.020 * sin(2 * g));
  const e = 23.439 - 0.00000036 * D;
  const RA = fixHour(atan2(cos(e) * sin(L), cos(L)) / 15);
  const eqt = q / 15 - RA;
  const decl = asin(sin(e) * sin(L));
  return { decl, eqt };
}

const METHODS = {
  karachi: { fajr: 18, isha: 18 },
  mwl:     { fajr: 18, isha: 17 },
  isna:    { fajr: 15, isha: 15 },
  egypt:   { fajr: 19.5, isha: 17.5 },
  makkah:  { fajr: 18.5, ishaMin: 90 }
};

// y, m (1-12), d = local tareekh; natija: Date objects (UTC waqt) ya NaN
function calcTimes(y, m, d, lat, lng, method, asrFactor) {
  const M = METHODS[method] || METHODS.karachi;
  const jd0 = julian(y, m, d) - lng / (15 * 24);
  const decl = t => sunPos(jd0 + t).decl;
  const noon = t => fixHour(12 - sunPos(jd0 + t).eqt);
  function ang(angle, t, ccw) {
    const dc = decl(t);
    const v = (-sin(angle) - sin(dc) * sin(lat)) / (cos(dc) * cos(lat));
    if (v < -1 || v > 1) return NaN;
    return noon(t) + (ccw ? -1 : 1) * acos(v) / 15;
  }
  function asr(f, t) {
    const dc = decl(t);
    return ang(-arccot(f + tan(Math.abs(lat - dc))), t, false);
  }
  const raw = {
    fajr: ang(M.fajr, 5 / 24, true),
    sunrise: ang(0.833, 6 / 24, true),
    zuhr: noon(12 / 24),
    asr: asr(asrFactor, 13 / 24),
    maghrib: ang(0.833, 18 / 24, false)
  };
  raw.isha = M.ishaMin ? raw.maghrib + M.ishaMin / 60 : ang(M.isha, 18 / 24, false);
  const base = Date.UTC(y, m - 1, d);
  const out = {};
  for (const k in raw) {
    const utc = raw[k] - lng / 15;
    out[k] = isNaN(utc) ? NaN : Math.round((base + utc * 3600000) / 60000) * 60000;
  }
  return out;
}
/* ==CALC END== */
function homeTz(l) { try { return (l && l.tz) || Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch (e) { return "UTC"; } }
function homeYmd(date, tz) {
  const p = new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(date);
  const g = t => parseInt(p.find(x => x.type === t).value, 10);
  return { y: g("year"), m: g("month"), d: g("day") };
}
function homeFmt(ms, tz) { return new Intl.DateTimeFormat("en-US", { timeZone: tz, hour: "numeric", minute: "2-digit", hour12: true }).format(new Date(ms)); }
function npLoad() { try { const l = JSON.parse(localStorage.getItem("qibla_loc") || "null"); return (l && typeof l.lat === "number") ? l : null; } catch (e) { return null; } }
const NP_NAMES = { fajr: "Fajr", zuhr: "Zuhr", asr: "Asr", maghrib: "Maghrib", isha: "Isha" };
function npNext(l) {
  const method = localStorage.getItem("q_method") || "karachi";
  const asr = parseInt(localStorage.getItem("q_asr") || "2", 10);
  const tz = homeTz(l), now = Date.now();
  const p = homeYmd(new Date(now), tz);
  const t = calcTimes(p.y, p.m, p.d, l.lat, l.lng, method, asr);
  for (const k of ["fajr", "zuhr", "asr", "maghrib", "isha"]) if (t[k] > now) return { k, t: t[k], tz };
  const n = new Date(Date.UTC(p.y, p.m - 1, p.d) + 86400000);
  const t2 = calcTimes(n.getUTCFullYear(), n.getUTCMonth() + 1, n.getUTCDate(), l.lat, l.lng, method, asr);
  return { k: "fajr", t: t2.fajr, tz, tomorrow: true };
}
let npTimer = null;
function npRender() {
  const nEl = document.getElementById("npName");
  if (!nEl) { if (npTimer) { clearInterval(npTimer); npTimer = null; } return; }
  const l = npLoad();
  if (!l) {
    nEl.textContent = "Namaz ke auqaat";
    document.getElementById("npTime").textContent = "Location chunein";
    document.getElementById("npCd").textContent = "Dekhein ›";
    document.getElementById("npSub").textContent = "";
    return;
  }
  try {
    const x = npNext(l);
    const s = Math.max(0, Math.floor((x.t - Date.now()) / 1000));
    const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
    nEl.textContent = NP_NAMES[x.k] + (x.tomorrow ? " (kal)" : "");
    document.getElementById("npTime").textContent = homeFmt(x.t, x.tz);
    document.getElementById("npCd").textContent = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
    document.getElementById("npSub").textContent = "baqi";
  } catch (e) { nEl.textContent = "Namaz ke auqaat"; }
}
function hijriLine() {
  try {
    const tz = homeTz(npLoad());
    const adj = parseInt(localStorage.getItem("q_hadj") || "0", 10);
    const p = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", { timeZone: tz, day: "numeric", month: "long", year: "numeric" }).formatToParts(new Date(Date.now() + adj * 86400000));
    const g = t => (p.find(x => x.type === t) || {}).value || "";
    const eng = new Intl.DateTimeFormat("en-GB", { timeZone: tz, weekday: "long", day: "numeric", month: "long" }).format(new Date());
    return g("day") + " " + g("month") + " " + g("year") + " AH  •  " + eng;
  } catch (e) { return APP_SUB; }
}

  const tiles = [
    ["names", "book", "Naam"], ["duas", "moon", "Duain"], ["qibla", "compass", "Qibla"], ["times", "clock", "Auqaat"],
    ["tasbeeh", "beads", "Tasbeeh"], ["today", "cal", "Aaj ka Naam"], ["fav", "heart", "Pasandida"], ["msg", "mail", "Message"]
  ];

  app.innerHTML =
    "<div class='sb'>" +
    "<input id='hSearch' type='search' placeholder='Naam talash karein...'>" +
    "<button class='clear-sb' id='hClear' aria-label='Saaf'>" + ic("x") + "</button>" +
    "<button class='mic' id='hMic' aria-label='Awaaz'>" + ic("mic") + "</button>" +
    "<button class='sgo' id='hGo' aria-label='Talash'>" + ic("search") + "</button>" +
    "</div>" +
    "<div class='np' id='npCard'>" +
    "<div class='np-l'><div class='np-k'>Agli namaz</div><div class='np-n' id='npName'>--</div><div class='np-t' id='npTime'></div></div>" +
    "<div class='np-r'><div class='np-cd' id='npCd'>--:--:--</div><div class='np-sub' id='npSub'></div></div>" +
    "</div>" +
    "<div class='qa-grid'>" +
    tiles.map(t => "<div class='qa' data-a='" + t[0] + "'><div class='qi'>" + ic(t[1]) + "</div><div class='ql'>" + t[2] + "</div></div>").join("") +
    "</div>" +
    "<div class='quote'>" +
    "<div class='qlabel'>Aaj ki khoobsurat baat</div>" +
    "<div class='qtext' id='qText'>" + esc(todayQ) + "</div>" +
    "<div class='qactions'>" +
    "<button id='qLike' aria-label='Like'>" + ic("thumb") + "<span id='qLikeCount'>0</span></button>" +
    "<button id='qCopy' aria-label='Copy'>" + ic("copy") + "</button>" +
    "<button id='qShare' aria-label='Share'>" + ic("share") + "</button>" +
    "<button id='qFav' aria-label='Pasandida' class='" + (isFavQ ? "on" : "") + "'>" + ic("heart") + "</button>" +
    "</div>" +
    "</div>";

  npRender();
  if (npTimer) clearInterval(npTimer);
  npTimer = setInterval(npRender, 1000);
  // Agar location pehle se allow hai aur save nahi, to chup-chap le lo
  if (!npLoad() && navigator.permissions && navigator.geolocation) {
    navigator.permissions.query({ name: "geolocation" }).then(r => {
      if (r.state === "granted") navigator.geolocation.getCurrentPosition(p => {
        try { localStorage.setItem("qibla_loc", JSON.stringify({ lat: p.coords.latitude, lng: p.coords.longitude, tz: homeTz(null), src: "gps", name: "Meri location" })); } catch (e) {}
        npRender();
      }, () => {});
    }).catch(() => {});
  }

  const likeBtn = document.getElementById("qLike");
  if (localStorage.getItem("liked_" + qKey) === "yes") likeBtn.classList.add("on");
  if (db) {
    db.collection("likes").doc(qKey).onSnapshot(doc => {
      const elc = document.getElementById("qLikeCount");
      if (elc) elc.textContent = doc.exists ? (doc.data().count || 0) : 0;
    }, () => {});
  }
  likeBtn.onclick = () => {
    if (localStorage.getItem("liked_" + qKey) === "yes") { showToast("Pehle hi like kar chuke hain!"); return; }
    if (!db) { showToast("Like ke liye internet chahiye"); return; }
    const ref = db.collection("likes").doc(qKey);
    ref.get().then(doc => {
      if (doc.exists) ref.update({ count: firebase.firestore.FieldValue.increment(1) });
      else ref.set({ count: 1 });
      localStorage.setItem("liked_" + qKey, "yes");
      likeBtn.classList.add("on");
      showToast("Shukriya!");
    }).catch(() => showToast("Like nahi ho saka"));
  };

  document.getElementById("qShare").onclick = () => shareQuote(todayQ);
  document.getElementById("qCopy").onclick = () => { copyText(todayQ + "\n\n— Meri Islamic App"); showToast("Copy ho gaya"); };
  const qFavBtn = document.getElementById("qFav");
  qFavBtn.onclick = () => {
    const at = FAVQ.indexOf(todayQ);
    if (at >= 0) { FAVQ.splice(at, 1); qFavBtn.classList.remove("on"); }
    else { FAVQ.push(todayQ); qFavBtn.classList.add("on"); }
    saveFavQ();
  };

  const hs = document.getElementById("hSearch");
  const hClear = document.getElementById("hClear");
  hs.addEventListener("input", () => hClear.classList.toggle("show", hs.value.length > 0));
  hClear.onclick = () => { hs.value = ""; hClear.classList.remove("show"); hs.focus(); };
  document.getElementById("hGo").onclick = () => goSearch(hs.value);
  hs.onkeydown = e => { if (e.key === "Enter") goSearch(hs.value); };
  const mic = document.getElementById("hMic");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { mic.style.display = "none"; }
  else {
    mic.onclick = () => {
      try {
        const r = new SR();
        r.lang = "ur-PK"; r.interimResults = false;
        r.onresult = ev => { hs.value = ev.results[0][0].transcript; hClear.classList.add("show"); goSearch(hs.value); };
        r.start();
      } catch (e) {}
    };
  }
}

app.onclick = e => {
  if (e.target.closest("#npCard")) { location.href = "qibla.html#auqaat"; return; }
  const q = e.target.closest(".qa");
  if (!q) return;
  const a = q.dataset.a;
  if (a === "names") namesPage();
  else if (a === "duas") location.href = "duas.html";
  else if (a === "qibla") location.href = "qibla.html";
  else if (a === "times") location.href = "qibla.html#auqaat";
  else if (a === "tasbeeh") location.href = "tasbeeh.html";
  else if (a === "today") todayName();
  else if (a === "fav") namesPage({ fav: true });
  else if (a === "msg") openMessageBox();
};

function openMessageBox() {
  if (!db) { showToast("Message ke liye internet chahiye"); return; }
  showModal(`
    <h3 style="color:var(--primary); margin-bottom:10px;">Aapka Message</h3>
    <input type="text" id="msgName" placeholder="Naam (Optional)" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:8px; font-family:inherit;">
    <textarea id="msgText" placeholder="Message..." style="width:100%; height:100px; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:8px; font-family:inherit; resize:none;"></textarea>
    <button id="sendMsgBtn" style="background:var(--primary); color:#fff; border:none; padding:12px; border-radius:8px; width:100%; font-family:inherit; font-size:16px;">Send</button>
  `);
  document.getElementById("sendMsgBtn").onclick = () => {
    const name = document.getElementById("msgName").value.trim() || "Anonymous";
    const text = document.getElementById("msgText").value.trim();
    if (!text) return;
    db.collection("messages").add({ name, text, timestamp: firebase.firestore.FieldValue.serverTimestamp() })
      .then(() => { modal.classList.remove("show"); showToast("✉️ Bhej diya gaya!"); });
  };
}

nav.onclick = e => {
  const b = e.target.closest("button[data-t]");
  if (!b) return;
  const t = b.dataset.t;
  if (t === "home") home();
  else if (t === "names") namesPage();
  else if (t === "fav") namesPage({ fav: true });
  else openCard(t);
};

function openCard(k) {
  if (k === "names") { namesPage(); return; }
  if (k === "duas") { location.href = "duas.html"; return; }
  if (DATA[k]) { category(k); return; }
  showModal("<b>Yeh hissa jald aa raha hai.</b>");
}

function category(key) {
  const d = DATA[key];
  if (!d) { openCard(key); return; }
  setMode("inner");
  title.textContent = d.title;
  sub.textContent = "";
  back.style.display = "flex";
  back.onclick = home;
  setNav(key);
  app.innerHTML = "";
  if (!d.items || !d.items.length) {
    app.innerHTML = "<div class='card' style='text-align:center;color:var(--text-secondary)'>Yahan abhi kuch nahi. Jald izafa hoga.</div>";
    return;
  }
  d.items.forEach(item => {
    const c = document.createElement("div");
    c.className = "card";
    c.textContent = item.t;
    c.onclick = () => detail(key, item);
    app.appendChild(c);
  });
}

function detail(key, item) {
  setMode("inner");
  title.textContent = item.t;
  sub.textContent = "";
  back.onclick = () => category(key);
  app.innerHTML = "";
  const d = document.createElement("div");
  d.className = "detail";
  d.textContent = item.d;
  app.appendChild(d);
  const actions = document.createElement("div");
  actions.style.cssText = "display:flex;gap:8px;margin-top:12px;justify-content:center;flex-wrap:wrap";
  actions.innerHTML =
    "<button class='qs' style='background:var(--primary);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-family:inherit;font-size:14px;display:inline-flex;align-items:center;gap:6px'>📤 Share</button>" +
    "<button class='qc' style='background:var(--surface-tint);color:var(--primary-deep);border:0;border-radius:999px;padding:10px 18px;font-family:inherit;font-size:14px;display:inline-flex;align-items:center;gap:6px'>📋 Copy</button>";
  app.appendChild(actions);
  const textShare = item.t + "\n\n" + item.d + "\n\n— Meri Islamic App";
  actions.querySelector(".qs").onclick = () => shareText(textShare, item.t);
  actions.querySelector(".qc").onclick = () => { copyText(textShare); showToast("📋 Copy ho gaya"); };
}

function namesPage(opts) {
  opts = opts || {};
  setMode("inner");
  app.dir = "ltr";
  title.textContent = opts.fav ? "Pasandida naam" : "Islami naam";
  sub.textContent = "";
  back.style.display = "flex";
  back.onclick = home;
  setNav(opts.fav ? "fav" : "names");
  app.innerHTML =
    "<div class='nsb'>" + ic("search") +
    "<input id='fSearch' type='search' placeholder='Naam ya matlab talash karein'>" +
    "<button class='nclr' id='fClr' aria-label='Saaf'>" + ic("x") + "</button></div>" +
    "<div class='nch'>" +
    "<button class='nc on' data-g=''>Sab</button>" +
    "<button class='nc' data-g='لڑکا'>Larke</button>" +
    "<button class='nc' data-g='لڑکی'>Larkiyan</button>" +
    "<button class='nc' id='cLetter'><span id='cLetterTxt'>Harf</span>" + ic("down") + "</button>" +
    "<button class='nc' id='cFav'>" + ic("heart") + "Pasandida</button>" +
    "</div>" +
    "<div class='nletters' id='letters'></div>" +
    "<div class='ncount' id='count'>Load ho raha hai...</div>" +
    "<div class='nlist' id='list'></div>" +
    "<button class='nmore' id='more'></button>";
  const fSearch = document.getElementById("fSearch");
  const fClr = document.getElementById("fClr");
  const cLetter = document.getElementById("cLetter");
  const cFav = document.getElementById("cFav");
  const lettersEl = document.getElementById("letters");
  const count = document.getElementById("count");
  const list = document.getElementById("list");
  const more = document.getElementById("more");
  const genderChips = [...document.querySelectorAll(".nc[data-g]")];
  let onlyFav = !!opts.fav;
  let G = "", L = "";
  let shown = PAGE;
  let current = [];
  cFav.classList.toggle("on", onlyFav);
  fSearch.value = opts.q || "";
  fClr.classList.toggle("show", fSearch.value.length > 0);

  function render(reset) {
    if (reset) shown = PAGE;
    const Q = fSearch.value.trim().toLowerCase();
    current = NAMES.filter(x =>
      (!onlyFav || FAV.includes(keyOf(x))) &&
      (!L || x.n.charAt(0) === L) &&
      (!G || x.g === G) &&
      (!Q || x.n.includes(Q) || x.e.toLowerCase().includes(Q) || x.m.includes(Q))
    );
    count.textContent = current.length + " naam";
    if (!current.length) {
      list.innerHTML = "<div class='nempty'>" + (onlyFav ? "Abhi koi pasandida naam nahi.<br>Kisi naam ke dil ko dabayein." : "Koi naam nahi mila.<br>Doosra lafz ya harf try karein.") + "</div>";
    } else {
      list.innerHTML = current.slice(0, shown).map((x, i) =>
        "<div class='nrow' data-idx='" + i + "'>" +
        "<div class='nav2 " + (x.g === "لڑکی" ? "f" : "m") + "'>" + esc(x.n.charAt(0)) + "</div>" +
        "<div class='nbody'><div class='nen'>" + esc(x.e) + "</div><div class='nmn'>" + esc(x.m) + "</div></div>" +
        "<div class='nur'>" + esc(x.n) + "</div>" +
        "<button class='nhrt" + (FAV.includes(keyOf(x)) ? " on" : "") + "' data-a='fav' data-i='" + i + "' aria-label='Pasandida'>" + ic("heart") + "</button>" +
        "</div>"
      ).join("");
    }
    if (current.length > shown) { more.style.display = "block"; more.textContent = "Mazeed dikhayein (" + (current.length - shown) + " baqi)"; }
    else { more.style.display = "none"; }
  }

  list.onclick = e => {
    const btn = e.target.closest("button[data-a]");
    if (btn) {
      const x = current[Number(btn.dataset.i)];
      if (!x) return;
      const k = keyOf(x);
      const at = FAV.indexOf(k);
      if (at >= 0) FAV.splice(at, 1); else FAV.push(k);
      saveFav();
      if (onlyFav) render(false);
      else btn.classList.toggle("on", FAV.includes(k));
      return;
    }
    const row = e.target.closest(".nrow");
    if (row) {
      const x = current[Number(row.dataset.idx)];
      if (x) nameDetailPage(x);
    }
  };
  more.onclick = () => { shown += PAGE; render(false); };
  genderChips.forEach(c => c.onclick = () => {
    G = c.dataset.g;
    genderChips.forEach(o => o.classList.toggle("on", o === c));
    render(true);
  });
  cFav.onclick = () => { onlyFav = !onlyFav; cFav.classList.toggle("on", onlyFav); render(true); };
  cLetter.onclick = () => lettersEl.classList.toggle("show");
  fSearch.addEventListener("input", () => { fClr.classList.toggle("show", fSearch.value.length > 0); render(true); });
  fClr.onclick = () => { fSearch.value = ""; fClr.classList.remove("show"); render(true); fSearch.focus(); };

  loadNames().then(names => {
    const letters = [...new Set(names.map(x => x.n.charAt(0)))].sort((a, b) => a.localeCompare(b, "ur"));
    lettersEl.innerHTML = "<button class='nl on' data-l=''>Sab</button>" + letters.map(l => "<button class='nl' data-l='" + esc(l) + "'>" + esc(l) + "</button>").join("");
    lettersEl.onclick = e => {
      const b = e.target.closest(".nl");
      if (!b) return;
      L = b.dataset.l;
      lettersEl.querySelectorAll(".nl").forEach(o => o.classList.toggle("on", o === b));
      document.getElementById("cLetterTxt").textContent = L ? "Harf: " + L : "Harf";
      cLetter.classList.toggle("on", !!L);
      render(true);
    };
    render(true);
  }).catch(() => { count.textContent = "names.json load nahi hui."; });
}

function nameDetailPage(x) {
  setMode("inner");
  title.textContent = x.n;
  sub.textContent = "";
  back.style.display = "flex";
  back.onclick = () => namesPage();
  setNav("names");
  const k = keyOf(x);
  const isFav = FAV.includes(k);
  app.innerHTML = `
    <div class="name-detail">
      <div class="nd-name">${esc(x.n)}</div>
      <div class="nd-en">${esc(x.e)}</div>
      <div class="nd-gender">${esc(x.g)}</div>
      <div class="nd-meaning">${esc(x.m)}</div>
      <div class="nd-actions">
        <button id="ndFav">${isFav ? "❤️ Pasandida" : "🤍 Pasandida"}</button>
        <button id="ndCopy" class="ghost" style="background:var(--surface-tint);color:var(--primary-deep)">📋 Copy</button>
        <button id="ndShare" class="ghost" style="background:var(--surface-tint);color:var(--primary-deep)">📤 Share</button>
      </div>
    </div>`;
  document.getElementById("ndFav").onclick = () => {
    const at = FAV.indexOf(k);
    const btn = document.getElementById("ndFav");
    if (at >= 0) { FAV.splice(at, 1); btn.textContent = "🤍 Pasandida"; showToast("Pasandida se hata diya"); }
    else { FAV.push(k); btn.textContent = "❤️ Pasandida"; showToast("❤️ Pasandida mein mehfooz"); }
    saveFav();
  };
  document.getElementById("ndCopy").onclick = () => {
    copyText(x.n + " (" + x.e + ")\nMeaning: " + x.m);
    showToast("📋 Copy ho gaya");
  };
  document.getElementById("ndShare").onclick = () => shareName(x);
}

            <div class="fs-label">Bara</div>

      <div class="set-item" id="sTerms">

        <div class="set-arrow">‹</div>

        <div class="set-label"><span class="set-ic">✉️</span><span>Feedback</span></div>

        <div class="set-label"><span class="set-ic">⭐</span><span>App Rating</span></div>
        <div class="set-val">Jald aa raha hai</div>
      </div>
    </div>
  `;

  document.getElementById("sAbout").onclick = () => showModal("<b>Meri Islamic App</b><br>Version " + APP_VERSION + "<br><br><small style='color:#64756C'>Yeh ek muft Islami app hai. Allah qubool farmaye.</small>");
  document.getElementById("sShare").onclick = () => shareApp();
  document.getElementById("sDark").onclick = () => {
    const wasDark = localStorage.getItem("theme") === "dark";
    localStorage.setItem("theme", wasDark ? "light" : "dark");
    applyTheme();
    document.getElementById("sDarkToggle").classList.toggle("on", !wasDark);
    setMode("inner");
    title.textContent = "Settings";
  };
  document.querySelectorAll(".fs-opt").forEach(b => {
    b.onclick = () => {
      const v = parseFloat(b.dataset.fs);
      localStorage.setItem("fontScale", String(v));
      document.documentElement.style.setProperty("--font-scale", v);
      document.querySelectorAll(".fs-opt").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      showToast("Font size tabdeel ho gaya");
    };

  document.getElementById("sPrivacy").onclick = () => showModal("<b>Privacy Policy</b><br><br><small style='text-align:right;display:block;line-height:2'>Yeh app aap ki zaati maloomat jama nahi karti. Aap ke pasandida naam aur settings sirf aap ke phone mein mehfooz hote hain.</small>");
  document.getElementById("sTerms").onclick = () => showModal("<b>Terms of Use</b><br><br><small style='text-align:right;display:block;line-height:2'>Yeh app muft hai. Kisi bhi naam ke meaning ki hatmi tasdeeq ke liye kisi mustanad aalim se rujoo karein.</small>");
  document.getElementById("sFeedback").onclick = () => {
    window.location.href = "mailto:?subject=" + encodeURIComponent("Meri Islamic App - Feedback") + "&body=" + encodeURIComponent("Assalam o Alaikum,\n\nMeri raye:\n\n");
  };
  document.getElementById("sRate").onclick = () => showToast("Play Store par aane ke baad rating mumkin hogi");

applyTheme();
applyFontScale();
Promise.all([
  fetch("data.json", { cache: "no-store" }).then(r => r.json()),
  fetch("quotes.json", { cache: "no-store" }).then(r => r.json()).catch(() => null)
]).then(res => {
  DATA = res[0];
  if (Array.isArray(res[1]) && res[1].length) QUOTES = res[1];
  home();
}).catch(() => { app.innerHTML = "<div class='card'>Data load nahi hua. data.json mein koi ghalti ho sakti hai.</div>"; });
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js"); }
</script>

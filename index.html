<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meri Islamic App</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f6b4a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { overflow-x: hidden; width: 100%; }
    body { margin: 0; width: 100%; overflow-x: hidden; overflow-wrap: break-word; overscroll-behavior: none; touch-action: pan-y pinch-zoom; font-family: "Noto Nastaliq Urdu", sans-serif; background: #f3f7f4; color: #1b3a2b; padding-bottom: calc(70px + env(safe-area-inset-bottom)); min-height: 100vh; }
    body.home { background: linear-gradient(#eaf6ee, #d9eddf); }
    body.dark { background: #0b1612; color: #e6efe9; }

    #hdr { background: #0f6b4a; color: #fff; padding: 22px 16px; text-align: center; position: relative; }
    #hdr h1 { margin: 0 0 4px; font-size: 24px; line-height: 1.9; position: relative; z-index: 2; }
    #hdr p { margin: 0; opacity: 0.85; line-height: 1.8; position: relative; z-index: 2; }
    #greet { display: none; }
    .decos { display: none; position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden; pointer-events: none; z-index: 1; }
    .deco { position: absolute; height: auto; }
    #hdr.hero { background: radial-gradient(circle at 30% 20%, #17935f 0%, rgba(23,147,95,0) 45%), linear-gradient(160deg, #0b5b3c, #0d6f48 55%, #0a4a31); padding: 30px 16px 54px; border-radius: 0 0 30px 30px; }
    #hdr.hero .decos { display: block; border-radius: 0 0 30px 30px; }
    #hdr.hero h1 { font-size: 30px; line-height: 1.6; margin-bottom: 0; }
    #hdr.hero p { font-size: 19px; line-height: 1.7; color: #f2cf6b; opacity: 1; font-weight: 700; }
    #hdr.hero #greet { display: block; margin-top: 6px; font-size: 14px; line-height: 1.9; position: relative; z-index: 2; }
    .moon { top: 20px; left: 24%; width: 44px; filter: drop-shadow(0 0 10px rgba(247,224,140,0.7)); }
    .mosque { left: 0; bottom: 12px; width: 32%; max-width: 130px; }
    .lantern { width: 24px; filter: drop-shadow(0 0 8px rgba(247,224,140,0.8)); }
    .lantern-l { left: 62px; top: 0; }
    .lantern-r { right: 10px; top: 30px; }

    #back { display: none; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); color: white; border: 0; border-radius: 8px; padding: 8px 12px; font-size: 16px; font-family: inherit; z-index: 3; }
    #menuBtn { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); color: white; border: 0; border-radius: 8px; width: 40px; height: 40px; font-size: 24px; line-height: 1; font-family: sans-serif; z-index: 3; }
    #hdr.hero #menuBtn { top: 24px; transform: none; }
    #menu { display: none; position: absolute; left: 12px; top: 68px; background: white; color: #1b3a2b; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); min-width: 210px; z-index: 25; overflow: hidden; }
    #hdr.hero #menu { top: 74px; }
    #menu.show { display: block; }
    #menu button { display: block; width: 100%; text-align: right; padding: 12px 16px; border: 0; background: none; font-family: inherit; font-size: 17px; color: inherit; line-height: 2; }
    #menu button + button { border-top: 1px solid #e3ece6; }

    #modal { display: none; position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 30; padding: 20px; }
    #modal.show { display: flex; }
    #modalBox { background: white; color: #1b3a2b; border-radius: 16px; padding: 20px; line-height: 2.2; max-width: 420px; width: 100%; text-align: center; font-size: 18px; }
    .mb { background: none; border: 0; font-size: 26px; padding: 4px 12px; }

    #app { padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
    body.home #app { padding: 0 14px 14px; gap: 10px; }
    #app > * { min-width: 0; max-width: 100%; }
    .card { background: white; border-radius: 14px; padding: 16px 18px; font-size: 20px; line-height: 2; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .detail { background: white; border-radius: 14px; padding: 20px 18px; line-height: 2.4; font-size: 20px; white-space: pre-line; }

    .sb { display: flex; align-items: center; gap: 6px; background: #fff; border-radius: 40px; padding: 5px 8px; box-shadow: 0 6px 18px rgba(0,60,30,0.18); margin-top: -28px; position: relative; z-index: 3; }
    .sb input { flex: 1 1 auto; width: 0; min-width: 0; border: 0; outline: 0; background: none; font-family: inherit; font-size: 15px; color: #1b3a2b; padding: 6px 6px; }
    .sgo { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; border: 0; background: #0f6b4a; color: #fff; font-size: 16px; }
    .mic { flex: 0 0 auto; border: 0; background: none; font-size: 18px; color: #0f6b4a; padding: 4px 6px; }

    .hgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .hc { min-width: 0; display: flex; flex-direction: column; background: linear-gradient(160deg, #fff, #eaf6ee); border-radius: 18px; padding: 8px 12px; box-shadow: 0 4px 12px rgba(0,60,30,0.12); border: 1px solid #d3e8da; }
    .hc .tt { font-size: 17px; font-weight: 700; color: #0b4d34; line-height: 1.8; }
    .hc .ds { font-size: 11.5px; color: #4a6b5b; line-height: 1.8; flex: 1; }
    .hc .ft { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
    .hc .ic { font-size: 24px; line-height: 1; }
    .hc .go { width: 26px; height: 26px; border-radius: 50%; background: #0f6b4a; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; }

    .quote { position: relative; margin-top: 2px; background: linear-gradient(150deg, #0b5b3c, #08402b); border: 2px solid #d9b44a; border-radius: 20px; padding: 30px 14px 8px; text-align: center; color: #fff; box-shadow: 0 6px 16px rgba(0,60,30,0.25); }
    .qlabel { position: absolute; top: -2px; right: 18px; background: linear-gradient(#f6dc83, #d9b44a); color: #4a3200; font-weight: 700; font-size: 13px; padding: 0 14px; border-radius: 0 0 14px 14px; line-height: 2; }
    .qtext { font-size: 17px; line-height: 2; }
    .qheart { color: #f2cf6b; font-size: 14px; line-height: 1.6; }

    .qa { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .qb { min-width: 0; background: linear-gradient(160deg, #fff, #eaf6ee); border: 1px solid #d3e8da; border-radius: 14px; padding: 6px 2px; text-align: center; font-size: 11px; line-height: 1.7; color: #0b4d34; box-shadow: 0 3px 8px rgba(0,60,30,0.1); }
    .qb span { display: block; font-size: 21px; line-height: 1.3; }

    #nav { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; z-index: 15; display: flex; background: linear-gradient(#0f6b4a, #0a4a31); border-radius: 20px 20px 0 0; padding: 5px 6px calc(5px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 14px rgba(0,0,0,0.25); }
    #nav button { flex: 1 1 0; min-width: 0; background: none; border: 0; color: #cfe8da; font-family: inherit; font-size: 11px; line-height: 1.6; padding: 2px 0; opacity: 0.85; }
    #nav button span { display: block; font-size: 20px; line-height: 1.3; }
    #nav button.on { color: #7dffb4; opacity: 1; }

    body.dark #app { padding: 10px 8px 24px; gap: 10px; }
    .panel { background: #12231c; border: 1px solid #23403a; border-radius: 14px; padding: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .srch { display: flex; gap: 8px; }
    .panel select, .panel input { width: 100%; min-width: 0; padding: 8px 10px; font-size: 14px; font-family: inherit; background: #0b1511; color: #e6efe9; border: 1px solid #2c4a42; border-radius: 10px; }
    .panel input { flex: 1 1 auto; width: 0; }
    .panel button { flex: 0 0 auto; padding: 8px 16px; font-size: 16px; font-family: inherit; background: #6fd3aa; color: #0b2a1e; border: 0; border-radius: 10px; }
    .bar { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
    .count { color: #d4b84a; font-size: 15px; }
    .chip { background: #12231c; color: #e6efe9; border: 1px solid #2c4a42; border-radius: 20px; padding: 4px 14px; font-size: 14px; font-family: inherit; }
    .chip.on { background: #6fd3aa; color: #0b2a1e; border-color: #6fd3aa; }
    .list { background: #0f1c17; border: 1px solid #23403a; border-radius: 14px; overflow: hidden; }
    .r { display: grid; grid-template-columns: 27% 22% minmax(0, 1fr) 34px; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid #1c312a; }
    .r:nth-child(even) { background: #12231c; }
    .r:last-child { border-bottom: 0; }
    .nm { color: #6fd3aa; font-size: 17px; line-height: 1.9; }
    .en { color: #d4b84a; font-family: Georgia, serif; font-size: 12px; text-align: center; line-height: 1.4; word-break: break-word; }
    .mn { color: #cfe0d6; font-size: 13px; line-height: 1.9; }
    .ac { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .ac button { background: none; border: 0; padding: 2px; font-size: 16px; line-height: 1; }
    .more { display: none; width: 100%; padding: 10px; font-size: 15px; font-family: inherit; background: #12231c; color: #6fd3aa; border: 1px solid #2c4a42; border-radius: 12px; }
    .empty { padding: 24px; text-align: center; color: #9bb3a8; font-size: 15px; line-height: 2; }
  </style>
</head>
<body class="home">
  <header id="hdr" class="hero">
    <div class="decos">
      <svg class="deco moon" viewBox="0 0 100 100"><defs><mask id="cm"><rect width="100" height="100" fill="#fff"/><circle cx="64" cy="38" r="34" fill="#000"/></mask></defs><circle cx="46" cy="52" r="38" fill="#f7e08c" mask="url(#cm)"/></svg>
      <svg class="deco mosque" viewBox="0 0 200 110"><g fill="#0a4a31"><rect x="30" y="62" width="140" height="48"/><path d="M62 62a38 38 0 0 1 76 0z"/><rect x="98" y="14" width="4" height="12"/><circle cx="100" cy="12" r="3"/><rect x="8" y="40" width="14" height="70"/><path d="M8 40l7-22l7 22z"/><rect x="178" y="40" width="14" height="70"/><path d="M178 40l7-22l7 22z"/><path d="M36 62a14 14 0 0 1 28 0z"/><path d="M136 62a14 14 0 0 1 28 0z"/></g><g fill="#f7e08c" opacity="0.9"><rect x="92" y="78" width="16" height="32" rx="8"/><rect x="48" y="84" width="10" height="20" rx="5"/><rect x="142" y="84" width="10" height="20" rx="5"/></g></svg>
      <svg class="deco lantern lantern-l" viewBox="0 0 40 90"><line x1="20" y1="0" x2="20" y2="16" stroke="#c9a23c" stroke-width="2"/><path d="M11 16h18l5 8H6z" fill="#c9a23c"/><rect x="9" y="24" width="22" height="40" rx="8" fill="#f7e08c"/><rect x="18" y="24" width="4" height="40" fill="#c9a23c" opacity="0.5"/><path d="M11 64h18l-4 12H15z" fill="#c9a23c"/></svg>
      <svg class="deco lantern lantern-r" viewBox="0 0 40 90"><line x1="20" y1="0" x2="20" y2="16" stroke="#c9a23c" stroke-width="2"/><path d="M11 16h18l5 8H6z" fill="#c9a23c"/><rect x="9" y="24" width="22" height="40" rx="8" fill="#f7e08c"/><rect x="18" y="24" width="4" height="40" fill="#c9a23c" opacity="0.5"/><path d="M11 64h18l-4 12H15z" fill="#c9a23c"/></svg>
    </div>

    <button id="back">واپس</button>
    <button id="menuBtn" aria-label="مینو">⋮</button>
    <div id="menu">
      <button id="mShare">📤 ایپ شیئر کریں</button>
      <button id="mAbout">ℹ️ ایپ کے بارے میں</button>
    </div>
    <h1 id="title"></h1>
    <p id="sub"></p>
    <div id="greet"></div>
  </header>

  <div id="app"></div>

  <nav id="nav">
    <button data-t="home"><span>🏠</span>ہوم</button>
    <button data-t="names"><span>📖</span>نام</button>
    <button data-t="poetry"><span>✍️</span>شاعری</button>
    <button data-t="stories"><span>📚</span>کہانیاں</button>
    <button data-t="fav"><span>❤️</span>پسندیدہ</button>
  </nav>

  <div id="modal"><div id="modalBox"></div></div>

  <script>
    const APP_TITLE = "اسلامی نام";
    const APP_SUB = "میری اسلامی ایپ";
    const GREETING = "السلام علیکم! 💚 اللہ تعالیٰ آپ کے ساتھ ہو";
    const QUOTES = [
      "اللہ پر بھروسہ رکھو، وہ ہمیشہ بہتر کرتا ہے۔",
      "اچھا اخلاق سب سے بڑی دولت ہے۔",
      "سچ بولنے سے دل کو سکون ملتا ہے۔",
      "شکر کرنے سے نعمتوں میں برکت ہوتی ہے۔",
      "صبر کا پھل ہمیشہ میٹھا ہوتا ہے۔",
      "ماں باپ کی خدمت سب سے بڑی نیکیوں میں سے ہے۔",
      "مسکرا کر ملنا بھی نیکی ہے۔"
    ];
    const META = {
      poetry: { title: "شاعری", icon: "✍️", desc: "اسلامی اور سبق آموز شاعری" },
      names: { title: "اسلامی نام", icon: "📖", desc: "لڑکوں اور لڑکیوں کے نام" },
      info: { title: "اسلامی معلومات", icon: "🕌", desc: "سوالات اور دلچسپ معلومات" },
      stories: { title: "کہانیاں", icon: "📚", desc: "مختصر اور سبق آموز کہانیاں" }
    };
    const ORDER = ["poetry", "names", "info", "stories"];
    const MORE_TEXT = "<b>جلد آنے والے فیچرز</b><br>• روزانہ نوٹیفکیشن<br>• اسلامی معلومات<br>• مزید نام، شاعری اور کہانیاں";
    const PAGE = 100;

    let DATA = {};
    let NAMES = null;

    let FAV = [];
    try { FAV = JSON.parse(localStorage.getItem("fav_names") || "[]"); } catch (e) { FAV = []; }
    function saveFav() { try { localStorage.setItem("fav_names", JSON.stringify(FAV)); } catch (e) {} }
    const keyOf = x => x.n + "|" + x.e;

    const hdr = document.getElementById("hdr");
    const app = document.getElementById("app");
    const back = document.getElementById("back");
    const title = document.getElementById("title");
    const sub = document.getElementById("sub");
    const greet = document.getElementById("greet");
    const menuBtn = document.getElementById("menuBtn");
    const menu = document.getElementById("menu");
    const modal = document.getElementById("modal");
    const modalBox = document.getElementById("modalBox");
    const nav = document.getElementById("nav");

    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function dayNumber() {
      const d = new Date();
      return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
    }

    function setMode(mode) {
      document.body.className = mode;
      hdr.classList.toggle("hero", mode === "home");
      window.scrollTo(0, 0);
    }

    function setNav(t) {
      nav.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
    }

    function showModal(html) {
      modalBox.innerHTML = html;
      modal.classList.add("show");
    }

    menuBtn.onclick = e => { e.stopPropagation(); menu.classList.toggle("show"); };
    document.addEventListener("click", () => menu.classList.remove("show"));
    modal.onclick = () => modal.classList.remove("show");
    modalBox.onclick = e => e.stopPropagation();

    function shareText(text, titleText) {
      if (navigator.share) {
        navigator.share({ title: titleText, text: text }).catch(() => {});
      } else {
        window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
      }
    }

    function shareApp() {
      const url = location.origin + location.pathname;
      shareText("میری اسلامی ایپ: اسلامی نام، شاعری اور کہانیاں\n" + url, "میری اسلامی ایپ");
    }

    function shareName(x) {
      const url = location.origin + location.pathname;
      shareText(x.n + " (" + x.e + ")\nمعنی: " + x.m + "\n\nمیری اسلامی ایپ:\n" + url, x.n);
    }

    document.getElementById("mShare").onclick = shareApp;
    document.getElementById("mAbout").onclick = () => {
      showModal("<b>میری اسلامی ایپ</b><br>اسلامی نام، شاعری اور کہانیاں<br>ورژن 1.4");
    };

    function loadNames() {
      if (NAMES) return Promise.resolve(NAMES);
      return fetch("names.json", { cache: "no-store" })
        .then(r => r.json())
        .then(j => {
          NAMES = j.sort((a, b) => a.n.localeCompare(b.n, "ur"));
          return NAMES;
        });
    }

    function todayName() {
      loadNames()
        .then(list => {
          const x = list[dayNumber() % list.length];
          const k = keyOf(x);
          showModal(
            "<div style='font-size:15px;color:#4a6b5b'>آج کا نام</div>" +
            "<div style='font-size:34px;color:#0f6b4a;line-height:2'>" + esc(x.n) + "</div>" +
            "<div style='font-family:Georgia,serif;color:#a07d12'>" + esc(x.e) + "</div>" +
            "<div style='margin:6px 0 10px'>" + esc(x.m) + "</div>" +
            "<div><button class='mb' id='tFav'>" + (FAV.includes(k) ? "❤️" : "🤍") + "</button><button class='mb' id='tSh'>📤</button></div>"
          );
          document.getElementById("tFav").onclick = e => {
            const at = FAV.indexOf(k);
            if (at >= 0) FAV.splice(at, 1); else FAV.push(k);
            saveFav();
            e.target.textContent = FAV.includes(k) ? "❤️" : "🤍";
          };
          document.getElementById("tSh").onclick = () => shareName(x);
        })
        .catch(() => showModal("نام لوڈ نہیں ہو سکا۔"));
    }

    function goSearch(q) { namesPage({ q: String(q || "").trim() }); }

    function home() {
      setMode("home");
      title.textContent = APP_TITLE;
      sub.textContent = APP_SUB;
      greet.textContent = GREETING;
      back.style.display = "none";
      setNav("home");

      const q = QUOTES[dayNumber() % QUOTES.length];
      app.innerHTML =
        "<div class='sb'>" +
          "<button class='mic' id='hMic'>🎤</button>" +
          "<input id='hSearch' type='search' placeholder='اپنا پسندیدہ نام تلاش کریں...'>" +
          "<button class='sgo' id='hGo'>🔍</button>" +
        "</div>" +
        "<div class='hgrid'>" +
          ORDER.map(k =>
            "<div class='hc' data-k='" + k + "'>" +
              "<div class='tt'>" + META[k].title + "</div>" +
              "<div class='ds'>" + META[k].desc + "</div>" +
              "<div class='ft'><span class='ic'>" + META[k].icon + "</span><span class='go'>←</span></div>" +
            "</div>"
          ).join("") +
        "</div>" +
        "<div class='quote'>" +
          "<div class='qlabel'>آج کی خوبصورت بات</div>" +
          "<div class='qtext'>" + esc(q) + "</div>" +
          "<div class='qheart'>💛</div>" +
        "</div>" +
        "<div class='qa'>" +
          "<div class='qb' data-a='more'><span>⭐</span>مزید فیچرز<br>دیکھیں</div>" +
          "<div class='qb' data-a='today'><span>📅</span>آج کا نام<br>(روزانہ نیا)</div>" +
          "<div class='qb' data-a='fav'><span>❤️</span>پسندیدہ<br>فہرست</div>" +
          "<div class='qb' data-a='share'><span>📤</span>دوستوں کو<br>شیئر کریں</div>" +
        "</div>";

      const hs = document.getElementById("hSearch");
      document.getElementById("hGo").onclick = () => goSearch(hs.value);
      hs.onkeydown = e => { if (e.key === "Enter") goSearch(hs.value); };

      const mic = document.getElementById("hMic");
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        mic.style.display = "none";
      } else {
        mic.onclick = () => {
          try {
            const r = new SR();
            r.lang = "ur-PK";
            r.interimResults = false;
            r.onresult = ev => { hs.value = ev.results[0][0].transcript; goSearch(hs.value); };
            r.start();
          } catch (e) {}
        };
      }
    }

    app.onclick = e => {
      const hc = e.target.closest(".hc");
      if (hc) { openCard(hc.dataset.k); return; }
      const qb = e.target.closest(".qb");
      if (qb) {
        const a = qb.dataset.a;
        if (a === "more") showModal(MORE_TEXT);
        else if (a === "today") todayName();
        else if (a === "fav") namesPage({ fav: true });
        else if (a === "share") shareApp();
      }
    };

    nav.onclick = e => {
      const b = e.target.closest("button[data-t]");
      if (!b) return;
      const t = b.dataset.t;
      if (t === "home") home();
      else if (t === "names") namesPage();
      else if (t === "fav") namesPage({ fav: true });
      else openCard(t);
    };

    function openCard(k) {
      if (k === "names") { namesPage(); return; }
      if (DATA[k]) { category(k); return; }
      showModal("<b>" + META[k].title + "</b><br>یہ حصہ جلد آ رہا ہے۔");
    }

    function category(key) {
      const d = DATA[key];
      if (!d) { openCard(key); return; }
      setMode("inner");
      title.textContent = d.title;
      sub.textContent = "";
      back.style.display = "block";
      back.onclick = home;
      setNav(key);
      app.innerHTML = "";
      d.items.forEach(item => {
        const c = document.createElement("div");
        c.className = "card";
        c.textContent = item.t;
        c.onclick = () => detail(key, item);
        app.appendChild(c);
      });
    }

    function detail(key, item) {
      setMode("inner");
      title.textContent = item.t;
      sub.textContent = "";
      back.onclick = () => category(key);
      app.innerHTML = "";
      const d = document.createElement("div");
      d.className = "detail";
      d.textContent = item.d;
      app.appendChild(d);
    }

    function namesPage(opts) {
      opts = opts || {};
      setMode("dark");
      title.textContent = opts.fav ? "پسندیدہ نام" : META.names.title;
      sub.textContent = "";
      back.style.display = "block";
      back.onclick = home;
      setNav(opts.fav ? "fav" : "names");

      app.innerHTML = `
        <div class="panel">
          <div class="two">
            <select id="fLetter"><option value="">حرف (سب)</option></select>
            <select id="fGender">
              <option value="">جنس (سب)</option>
              <option value="لڑکا">لڑکا</option>
              <option value="لڑکی">لڑکی</option>
            </select>
          </div>
          <div class="srch">
            <input id="fSearch" type="search" placeholder="نام یا معنی تلاش کریں">
            <button id="fBtn">🔍</button>
          </div>
        </div>
        <div class="bar">
          <span class="count" id="count">لوڈ ہو رہا ہے...</span>
          <button class="chip" id="fFav">🤍 پسندیدہ</button>
        </div>
        <div class="list" id="list"></div>
        <button class="more" id="more"></button>`;

      const fLetter = document.getElementById("fLetter");
      const fGender = document.getElementById("fGender");
      const fSearch = document.getElementById("fSearch");
      const fBtn = document.getElementById("fBtn");
      const fFav = document.getElementById("fFav");
      const count = document.getElementById("count");
      const list = document.getElementById("list");
      const more = document.getElementById("more");

      let onlyFav = !!opts.fav;
      let shown = PAGE;
      let current = [];

      if (onlyFav) {
        fFav.classList.add("on");
        fFav.textContent = "❤️ پسندیدہ";
      }
      fSearch.value = opts.q || "";

      function render(reset) {
        if (reset) shown = PAGE;
        const L = fLetter.value;
        const G = fGender.value;
        const Q = fSearch.value.trim().toLowerCase();
        current = NAMES.filter(x =>
          (!onlyFav || FAV.includes(keyOf(x))) &&
          (!L || x.n.charAt(0) === L) &&
          (!G || x.g === G) &&
          (!Q || x.n.includes(Q) || x.e.toLowerCase().includes(Q) || x.m.includes(Q))
        );
        count.textContent = current.length + " نام";

        if (!current.length) {
          list.innerHTML = "<div class='empty'>" + (onlyFav ? "ابھی کوئی پسندیدہ نام نہیں۔ کسی نام کے ساتھ 🤍 دبائیں۔" : "کوئی نام نہیں ملا۔") + "</div>";
        } else {
          list.innerHTML = current.slice(0, shown).map((x, i) =>
            "<div class='r'>" +
              "<div class='nm'>" + esc(x.n) + "</div>" +
              "<div class='en'>" + esc(x.e) + "</div>" +
              "<div class='mn'>" + esc(x.m) + "</div>" +
              "<div class='ac'>" +
                "<button data-a='fav' data-i='" + i + "'>" + (FAV.includes(keyOf(x)) ? "❤️" : "🤍") + "</button>" +
                "<button data-a='share' data-i='" + i + "'>📤</button>" +
              "</div>" +
            "</div>"
          ).join("");
        }

        if (current.length > shown) {
          more.style.display = "block";
          more.textContent = "مزید دکھائیں (" + (current.length - shown) + " باقی)";
        } else {
          more.style.display = "none";
        }
      }

      list.onclick = e => {
        const b = e.target.closest("button[data-a]");
        if (!b) return;
        const x = current[Number(b.dataset.i)];
        if (!x) return;
        if (b.dataset.a === "share") {
          shareName(x);
        } else {
          const k = keyOf(x);
          const at = FAV.indexOf(k);
          if (at >= 0) FAV.splice(at, 1); else FAV.push(k);
          saveFav();
          if (onlyFav) render(false);
          else b.textContent = FAV.includes(k) ? "❤️" : "🤍";
        }
      };

      more.onclick = () => { shown += PAGE; render(false); };

      fFav.onclick = () => {
        onlyFav = !onlyFav;
        fFav.classList.toggle("on", onlyFav);
        fFav.textContent = (onlyFav ? "❤️" : "🤍") + " پسندیدہ";
        render(true);
      };

      loadNames()
        .then(names => {
          const letters = [...new Set(names.map(x => x.n.charAt(0)))].sort((a, b) => a.localeCompare(b, "ur"));
          fLetter.innerHTML = '<option value="">حرف (سب)</option>' +
            letters.map(l => '<option value="' + esc(l) + '">' + esc(l) + '</option>').join("");
          fLetter.onchange = () => render(true);
          fGender.onchange = () => render(true);
          fSearch.oninput = () => render(true);
          fBtn.onclick = () => render(true);
          render(true);
        })
        .catch(() => {
          count.textContent = "names.json لوڈ نہیں ہوئی۔ فائل میں کوئی غلطی ہو سکتی ہے۔";
        });
    }

    fetch("data.json", { cache: "no-store" })
      .then(r => r.json())
      .then(j => { DATA = j; home(); })
      .catch(() => {
        app.innerHTML = "<div class='card'>Data load nahi hua. data.json mein koi ghalti ho sakti hai.</div>";
      });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>

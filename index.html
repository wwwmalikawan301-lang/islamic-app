<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meri Islamic App</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f6b4a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Noto Nastaliq Urdu", sans-serif; background: #f3f7f4; color: #1b3a2b; }
    header { background: #0f6b4a; color: white; padding: 22px 16px; text-align: center; position: relative; }
    header h1 { margin: 0 0 4px; font-size: 24px; line-height: 1.9; }
    header p { margin: 0; opacity: 0.85; line-height: 1.8; }
    #back { display: none; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); color: white; border: 0; border-radius: 8px; padding: 8px 12px; font-size: 16px; font-family: inherit; }
    #menuBtn { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); color: white; border: 0; border-radius: 8px; width: 40px; height: 40px; font-size: 24px; line-height: 1; font-family: sans-serif; }
    #menu { display: none; position: absolute; left: 12px; top: 68px; background: white; color: #1b3a2b; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); min-width: 210px; z-index: 10; overflow: hidden; }
    #menu.show { display: block; }
    #menu button { display: block; width: 100%; text-align: right; padding: 12px 16px; border: 0; background: none; font-family: inherit; font-size: 17px; color: inherit; line-height: 2; }
    #menu button + button { border-top: 1px solid #e3ece6; }
    #modal { display: none; position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 20; padding: 20px; }
    #modal.show { display: flex; }
    #modalBox { background: white; color: #1b3a2b; border-radius: 16px; padding: 20px; line-height: 2.2; max-width: 420px; text-align: center; font-size: 18px; }
    #app { padding: 16px; display: grid; gap: 14px; }
    .card { background: white; border-radius: 14px; padding: 16px 18px; font-size: 20px; line-height: 2; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .detail { background: white; border-radius: 14px; padding: 20px 18px; line-height: 2.4; font-size: 20px; white-space: pre-line; }

    body.dark { background: #0d1a16; color: #e6efe9; }
    .panel { background: #14251f; border: 1px solid #25403a; border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
    .panel select, .panel input { width: 100%; padding: 12px; font-size: 16px; font-family: inherit; background: #0b1511; color: #e6efe9; border: 1px solid #2c4a42; border-radius: 12px; }
    .panel button { padding: 12px; font-size: 18px; font-family: inherit; background: #6fd3aa; color: #0b2a1e; border: 0; border-radius: 12px; }
    .count { text-align: center; color: #d4b84a; font-size: 18px; }
    .tablewrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #0f3b2a; padding: 10px 8px; font-size: 18px; }
    td { padding: 10px 8px; border: 1px solid #25403a; line-height: 2; vertical-align: middle; font-size: 17px; }
    td.nm { color: #6fd3aa; font-size: 22px; }
    td.en { color: #d4b84a; font-family: Georgia, serif; text-align: center; font-size: 17px; }
  </style>
</head>
<body>
  <header>
    <button id="back">واپس</button>
    <button id="menuBtn" aria-label="مینو">⋮</button>
    <div id="menu">
      <button id="mShare">📤 ایپ شیئر کریں</button>
      <button id="mAbout">ℹ️ ایپ کے بارے میں</button>
    </div>
    <h1 id="title">السلام علیکم</h1>
    <p id="sub">میری اسلامک ایپ</p>
  </header>
  <div id="app"></div>
  <div id="modal"><div id="modalBox"></div></div>

  <script>
    let DATA = {};
    let NAMES = null;

    const app = document.getElementById("app");
    const back = document.getElementById("back");
    const title = document.getElementById("title");
    const sub = document.getElementById("sub");
    const menuBtn = document.getElementById("menuBtn");
    const menu = document.getElementById("menu");
    const modal = document.getElementById("modal");
    const modalBox = document.getElementById("modalBox");

    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    menuBtn.onclick = e => { e.stopPropagation(); menu.classList.toggle("show"); };
    document.addEventListener("click", () => menu.classList.remove("show"));
    modal.onclick = () => modal.classList.remove("show");

    document.getElementById("mShare").onclick = () => {
      const url = location.origin + location.pathname;
      const text = "میری اسلامک ایپ: اسلامی نام، شاعری اور کہانیاں";
      if (navigator.share) {
        navigator.share({ title: "میری اسلامک ایپ", text: text, url: url }).catch(() => {});
      } else {
        window.open("https://wa.me/?text=" + encodeURIComponent(text + " " + url), "_blank");
      }
    };

    document.getElementById("mAbout").onclick = () => {
      modalBox.innerHTML = "<b>میری اسلامک ایپ</b><br>اسلامی نام، شاعری اور کہانیاں<br>ورژن 1.0";
      modal.classList.add("show");
    };

    function setHead(t, s) {
      title.textContent = t;
      sub.textContent = s;
      document.body.classList.remove("dark");
    }

    function home() {
      setHead("السلام علیکم", "میری اسلامک ایپ");
      back.style.display = "none";
      app.innerHTML = "";
      for (const key in DATA) {
        const c = document.createElement("div");
        c.className = "card";
        c.textContent = DATA[key].icon + " " + DATA[key].title;
        c.onclick = () => (key === "names" ? namesPage() : category(key));
        app.appendChild(c);
      }
    }

    function category(key) {
      setHead(DATA[key].title, "");
      back.style.display = "block";
      back.onclick = home;
      app.innerHTML = "";
      DATA[key].items.forEach(item => {
        const c = document.createElement("div");
        c.className = "card";
        c.textContent = item.t;
        c.onclick = () => detail(key, item);
        app.appendChild(c);
      });
    }

    function detail(key, item) {
      setHead(item.t, "");
      back.onclick = () => category(key);
      app.innerHTML = "";
      const d = document.createElement("div");
      d.className = "detail";
      d.textContent = item.d;
      app.appendChild(d);
    }

    function loadNames() {
      if (NAMES) return Promise.resolve(NAMES);
      return fetch("names.json", { cache: "no-store" })
        .then(r => r.json())
        .then(j => {
          NAMES = j.sort((a, b) => a.n.localeCompare(b.n, "ur"));
          return NAMES;
        });
    }

    function namesPage() {
      setHead(DATA.names ? DATA.names.title : "اسلامی نام", "");
      document.body.classList.add("dark");
      back.style.display = "block";
      back.onclick = home;

      app.innerHTML = `
        <div class="panel">
          <select id="fLetter"><option value="">حرف منتخب کریں (سب)</option></select>
          <select id="fGender">
            <option value="">جنس منتخب کریں (سب)</option>
            <option value="لڑکا">لڑکا</option>
            <option value="لڑکی">لڑکی</option>
          </select>
          <input id="fSearch" type="search" placeholder="نام یا معنی لکھ کر تلاش کریں">
          <button id="fBtn">🔍 تلاش کریں</button>
        </div>
        <div class="count" id="count">لوڈ ہو رہا ہے...</div>
        <div class="tablewrap">
          <table>
            <thead><tr><th>نام</th><th>English</th><th>معنی</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>`;

      const fLetter = document.getElementById("fLetter");
      const fGender = document.getElementById("fGender");
      const fSearch = document.getElementById("fSearch");
      const fBtn = document.getElementById("fBtn");
      const count = document.getElementById("count");
      const tbody = document.getElementById("tbody");

      function render() {
        const L = fLetter.value;
        const G = fGender.value;
        const Q = fSearch.value.trim().toLowerCase();
        const list = NAMES.filter(x =>
          (!L || x.n.charAt(0) === L) &&
          (!G || x.g === G) &&
          (!Q || x.n.includes(Q) || x.e.toLowerCase().includes(Q) || x.m.includes(Q))
        );
        count.textContent = list.length + " نام";
        tbody.innerHTML = list.map(x =>
          "<tr><td class='nm'>" + esc(x.n) + "</td><td class='en'>" + esc(x.e) + "</td><td>" + esc(x.m) + "</td></tr>"
        ).join("");
      }

      loadNames()
        .then(list => {
          const letters = [...new Set(list.map(x => x.n.charAt(0)))].sort((a, b) => a.localeCompare(b, "ur"));
          fLetter.innerHTML = '<option value="">حرف منتخب کریں (سب)</option>' +
            letters.map(l => '<option value="' + esc(l) + '">' + esc(l) + '</option>').join("");
          fLetter.onchange = render;
          fGender.onchange = render;
          fSearch.oninput = render;
          fBtn.onclick = render;
          render();
        })
        .catch(() => {
          count.textContent = "names.json لوڈ نہیں ہوئی۔ فائل میں کوئی غلطی ہو سکتی ہے۔";
        });
    }

    fetch("data.json", { cache: "no-store" })
      .then(r => r.json())
      .then(j => { DATA = j; home(); })
      .catch(() => {
        app.innerHTML = "<div class='card'>Data load nahi hua. data.json mein koi ghalti ho sakti hai.</div>";
      });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meri Islamic App</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f6b4a">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; background: #f3f7f4; color: #1b3a2b; }
    header { background: #0f6b4a; color: white; padding: 22px 16px; text-align: center; position: relative; }
    header h1 { margin: 0 0 4px; font-size: 24px; }
    header p { margin: 0; opacity: 0.85; }
    #back { display: none; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); color: white; border: 0; border-radius: 8px; padding: 8px 12px; font-size: 16px; }
    #app { padding: 16px; display: grid; gap: 14px; }
    .card { background: white; border-radius: 14px; padding: 20px 18px; font-size: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .detail { background: white; border-radius: 14px; padding: 20px 18px; line-height: 2; font-size: 20px; white-space: pre-line; }
  </style>
</head>
<body>
  <header>
    <button id="back">Wapas</button>
    <h1 id="title">السلام علیکم</h1>
    <p id="sub">Meri Islamic App</p>
  </header>
  <div id="app"></div>

  <script>
    const DATA = {
      names: { title: "Islamic Names", icon: "📖", items: [
        { t: "Muhammad", d: "Matlab: jis ki bohat tareef ki jaye." },
        { t: "Fatima", d: "Matlab: door rakhne wali (buraiyon se)." },
        { t: "Ali", d: "Matlab: buland martabe wala." }
      ]},
      poetry: { title: "Poetry", icon: "✍️", items: [
        { t: "Sample nazm", d: "Yahan apni nazm likhna.\nHar misra nayi line mein." }
      ]},
      stories: { title: "Kahaniyan", icon: "📚", items: [
        { t: "Sample kahani", d: "Yahan poori kahani likhna." }
      ]}
    };

    const app = document.getElementById("app");
    const back = document.getElementById("back");
    const title = document.getElementById("title");
    const sub = document.getElementById("sub");

    function setHead(t, s) { title.textContent = t; sub.textContent = s; }

    function home() {
      if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
      setHead("السلام علیکم", "Meri Islamic App");
      back.style.display = "none";
      app.innerHTML = "";
      for (const key in DATA) {
        const c = document.createElement("div");
        c.className = "card";
        c.textContent = DATA[key].icon + " " + DATA[key].title;
        c.onclick = () => category(key);
        app.appendChild(c);
      }
    }

    function category(key) {
      setHead(DATA[key].title, "");
      back.style.display = "block";
      back.onclick = home;
      app.innerHTML = "";
      DATA[key].items.forEach(item => {
        const c = document.createElement("div");
        c.className = "card";
        c.textContent = item.t;
        c.onclick = () => detail(key, item);
        app.appendChild(c);
      });
    }

    function detail(key, item) {
      setHead(item.t, "");
      back.onclick = () => category(key);
      app.innerHTML = "";
      const d = document.createElement("div");
      d.className = "detail";
      d.textContent = item.d;
      app.appendChild(d);
    }

    home();
  </script>
</body>
</html>

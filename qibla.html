<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Digital Compass</title>
<meta name="theme-color" content="#0f6b4a">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background-color: #f4f6f8;
  color: #333;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header { 
  display: flex; align-items: center; justify-content: space-between; 
  padding: 20px; background: #0f6b4a; color: #fff;
}
.header h1 { font-size: 20px; font-weight: 600; margin: 0; }
.header button { background: none; border: none; color: #fff; font-size: 24px; }

.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* Compass Container */
.compass-wrapper {
  position: relative;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  background: #ffffff;
  border: 8px solid #2c3e50;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15), inset 0 0 20px rgba(0,0,0,0.05);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 30px;
}

/* Background rotator */
.compass-bg {
  position: absolute;
  width: 100%; height: 100%;
  border-radius: 50%;
  transition: transform 0.1s linear;
}

/* Degrees and markings */
.degree-text {
  position: absolute;
  font-size: 13px;
  font-weight: 700;
  color: #34495e;
  width: 40px;
  text-align: center;
  left: 50%;
  top: 50%;
  transform-origin: 0 0;
  margin-top: -8px;
  margin-left: -20px;
}

.tick {
  position: absolute;
  width: 2px;
  height: 8px;
  background: #bdc3c7;
  top: 10px;
  left: 50%;
  transform-origin: 50% 150px;
}
.tick-major { background: #2c3e50; width: 3px; height: 14px; }

.cardinal {
  position: absolute;
  font-size: 20px;
  font-weight: 800;
}
.c-n { top: 25px; left: 50%; transform: translateX(-50%); color: #e74c3c; }
.c-e { right: 25px; top: 50%; transform: translateY(-50%); color: #2980b9; }
.c-s { bottom: 25px; left: 50%; transform: translateX(-50%); color: #2c3e50; }
.c-w { left: 25px; top: 50%; transform: translateY(-50%); color: #2c3e50; }

/* The central needle */
.needle-container {
  position: absolute;
  top: 50%; left: 50%;
  width: 0; height: 0;
  z-index: 10;
}
.needle-rotate {
  position: absolute;
  top: 0; left: 0;
  width: 0; height: 0;
  transform-origin: 0 0;
  transition: transform 0.2s ease-out;
}
.needle-shape {
  position: absolute;
  bottom: 0; left: -10px;
  width: 0; height: 0;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-bottom: 120px solid #e74c3c; /* Red North */
  filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
}
.needle-shape::after {
  content: '';
  position: absolute;
  top: 120px; left: -10px;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-top: 120px solid #ecf0f1; /* White South */
}
.center-dot {
  position: absolute;
  top: -8px; left: -8px;
  width: 16px; height: 16px;
  background: #2c3e50;
  border-radius: 50%;
  z-index: 12;
  box-shadow: 0 2px 5px rgba(0,0,0,0.3);
}

/* Digital Display */
.digital-display {
  text-align: center;
  background: #fff;
  padding: 20px 40px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  width: 100%;
  max-width: 300px;
}
.degrees-number {
  font-size: 48px;
  font-weight: 800;
  color: #2c3e50;
  line-height: 1;
}
.degrees-dir {
  font-size: 20px;
  font-weight: 600;
  color: #7f8c8d;
  margin-top: 5px;
}
.status-text {
  margin-top: 10px;
  font-size: 12px;
  color: #e74c3c;
}

/* Calibration Button */
.calibrate-btn {
  margin-top: 20px;
  background: #f39c12;
  color: #fff;
  border: none;
  padding: 12px 24px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(243,156,18,0.3);
}
.calibrate-btn:active { transform: scale(0.96); }
</style>
</head>
<body>

<header class="header">
  <a href="index.html" style="color:white;text-decoration:none;font-size:20px;">←</a>
  <h1>Digital Compass</h1>
  <div style="width:24px;"></div>
</header>

<div class="main-content">
  
  <div class="compass-wrapper">
    <div class="compass-bg" id="compassBg">
      <!-- Ticks and numbers will be injected here -->
      
      <div class="cardinal c-n">N</div>
      <div class="cardinal c-e">E</div>
      <div class="cardinal c-s">S</div>
      <div class="cardinal c-w">W</div>
    </div>

    <div class="needle-container">
      <div class="needle-rotate" id="needleRotate">
        <div class="needle-shape"></div>
      </div>
    </div>
    <div class="center-dot"></div>
  </div>

  <div class="digital-display">
    <div class="degrees-number" id="degNum">0°</div>
    <div class="degrees-dir" id="degDir">North</div>
    <div class="status-text" id="statusText"></div>
  </div>

  <button class="calibrate-btn" id="calibrateBtn">🔄 Calibrate Compass</button>
</div>

<script>
const bg = document.getElementById('compassBg');
const needle = document.getElementById('needleRotate');
const degNum = document.getElementById('degNum');
const degDir = document.getElementById('degDir');
const statusText = document.getElementById('statusText');

let currentHeading = 0;
let smoothedHeading = 0;
let lastHeading = null;
const SMOOTHING = 0.15; // Keeps it steady
let isStarted = false;

// 1. Build the Compass Face (Ticks & Numbers)
for (let i = 0; i < 360; i += 10) {
  // Ticks
  const tick = document.createElement('div');
  tick.className = 'tick';
  if (i % 30 === 0) tick.classList.add('tick-major');
  // Rotate tick around center. Radius is 150px.
  tick.style.transform = `rotate(${i}deg)`;
  bg.appendChild(tick);

  // Numbers (Every 30 degrees)
  if (i % 30 === 0 && i !== 0 && i !== 90 && i !== 180 && i !== 270) {
    const txt = document.createElement('div');
    txt.className = 'degree-text';
    txt.innerText = i;
    // Move up to edge, rotate to face center
    txt.style.transform = `rotate(${i}deg) translateY(-130px) rotate(${-i}deg)`;
    bg.appendChild(txt);
  }
}

function getCardinal(deg) {
  const dirs = ["North", "North-East", "East", "South-East", "South", "South-West", "West", "North-West"];
  return dirs[Math.round(deg / 45) % 8];
}

// 2. The Sensor Logic (Android & iOS)
function handleOrientation(e) {
  let compass = null;

  if (e.webkitCompassHeading) {
    // iOS
    compass = e.webkitCompassHeading;
  } else if (e.absolute && e.alpha !== null) {
    // Android Absolute
    compass = 360 - e.alpha;
  } else if (e.alpha !== null) {
    // Android Fallback
    compass = 360 - e.alpha;
  }

  if (compass !== null) {
    isStarted = true;
    statusText.innerText = ""; // clear errors
    
    // Normalize to 0-360
    compass = (compass + 360) % 360;

    // Smoothing Filter (Stops shaking)
    if (lastHeading === null) {
      lastHeading = compass;
      smoothedHeading = compass;
    } else {
      let diff = compass - lastHeading;
      if (diff > 180) diff -= 360;
      if (diff < -180) diff += 360;
      
      smoothedHeading = lastHeading + (diff * SMOOTHING);
      
      if (smoothedHeading < 0) smoothedHeading += 360;
      if (smoothedHeading >= 360) smoothedHeading -= 360;
      
      lastHeading = compass;
    }

    currentHeading = smoothedHeading;
    updateUI();
  }
}

function updateUI() {
  // Rotate the compass face backwards
  bg.style.transform = `rotate(${-currentHeading}deg)`;
  
  // Keep the red needle pointing to North (always 0 relative to the screen)
  // But since the bg rotates, the needle must rotate opposite to the bg
  // Actually, the needle is fixed in the center, so we just rotate the background.
  // Wait, in standard compasses, the needle points North and the dial rotates.
  // Let's make the needle point to the current heading.
  
  needle.style.transform = `rotate(${currentHeading}deg)`;

  // Update text
  const rounded = Math.round(currentHeading);
  degNum.innerText = `${rounded}°`;
  degDir.innerText = getCardinal(rounded);
}

// 3. Start sensors
function startCompass() {
  statusText.innerText = "Waiting for sensor...";
  
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(permission => {
      if (permission === "granted") {
        window.addEventListener("deviceorientation", handleOrientation, true);
        setTimeout(checkStarted, 2000);
      } else {
        statusText.innerText = "Permission denied.";
      }
    }).catch(console.error);
  } else {
    window.addEventListener("deviceorientationabsolute", handleOrientation, true);
    window.addEventListener("deviceorientation", handleOrientation, true);
    setTimeout(checkStarted, 2000);
  }
}

function checkStarted() {
  if (!isStarted) {
    statusText.innerText = "Compass not responding. Try calibrating or move away from metal.";
  }
}

// 4. Calibrate Button
document.getElementById('calibrateBtn').onclick = () => {
  lastHeading = null;
  smoothedHeading = null;
  isStarted = false;
  statusText.innerText = "Calibrating... Move phone in 8-shape.";
  
  // Re-bind listeners to force reset
  window.removeEventListener("deviceorientationabsolute", handleOrientation, true);
  window.removeEventListener("deviceorientation", handleOrientation, true);
  
  setTimeout(() => {
    startCompass();
  }, 500);
};

// Start on load
startCompass();
</script>
</body>
</html>
